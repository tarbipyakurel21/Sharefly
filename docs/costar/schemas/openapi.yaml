          allOf:
            - "$ref": "#/components/schemas/AssessmentSourceType"
          description: "Code identifying the origin of the assessment data (e.g. which assessor/tax source supplied the valuation), used to gauge provenance and reliability of the figures."
        assessmentYear:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Tax assessment year the assessed valuation figures apply to, anchoring the assessor's improved/land/total values to a specific assessment roll period."
