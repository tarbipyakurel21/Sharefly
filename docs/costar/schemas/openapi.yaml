          type: "number"
          nullable: true
          description: "Structured land-size value (acreage/area with unit); the core size attribute for land valuation, per-acre metrics, and the Floor Area Ratio (FAR = GBA / Lot Size) denominator. Square-feet values are integers; other units allow up to two decimals. Net land area value in its original unit with no unit conversion; its unit is not reported separately."
        improvementsDescription:
          type: "string"
          nullable: true
          description: "Description of any improvements made to the land. Examples: rough graded, paved, curbs and sidewalks."
        topographyType:
          allOf:
            - "$ref": "#/components/schemas/TopographyType"
          description: "Code describing the land's topography (e.g. level, sloping, rolling); topography affects developability, site-work cost, and buildable area."
        onSiteImprovementType:
          allOf:
            - "$ref": "#/components/schemas/OnSiteImprovementType"
          description: "On-site improvements are refinements inside the lot boundaries that add to the land's development potential."
        zoningDescription:
          type: "string"
          nullable: true
          description: "Description of the lot density the land is zoned for, commonly stated in units per acre (sometimes per square foot); a key entitlement/developability attribute for valuation."
        landName:
          type: "string"
          nullable: true
          description: "The name of the land."
        maxDwellingUnitsAllowed:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The maximum number of dwelling units that can be built overall on this unit of land."
        currentUsageDescription:
          type: "string"
          nullable: true
          description: "Describes how the land is currently being used."
        lengthInFeet:
          type: "number"
          nullable: true
          description: "The length of the land, in feet."
        widthInFeet:
          type: "number"
          nullable: true
          description: "The width of the land, in feet."
        isLotIrregular:
          type: "boolean"
          nullable: true
          description: "Flag indicating whether the land is irregularly shaped."
        numberOfLots:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of lots on the unit of land."
        offSiteState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          nullable: true
          description: "Represents one of three states of off-site information for the land: 0 = nothing is known about off-site attributes; 1 = 'All To Site' (all off-site amenities are set up to service the land); 2 = 'All Needed' (no off-site amenities are set up to service the land)."
        proposedUses:
          type: "array"
          items:
            "$ref": "#/components/schemas/ProposedLandUse"
          description: "Proposed/best-use designation for the parcel, guiding development potential and valuation; aligns with the hierarchical land-use code taxonomy used to classify primary land use. List of the proposed land-use values from each proposed-use entry."
        developmentApprovals:
          type: "array"
          items:
            "$ref": "#/components/schemas/DevelopmentApprovalType"
          description: "Type of development approval/entitlement the land has obtained (e.g. zoning, permit, plat), indicating its shovel-readiness. Each row records one approval type held for the parcel. List of the approval types from each development-approval entry."
        offSiteUtilityType:
          allOf:
            - "$ref": "#/components/schemas/OffSiteUtilityType"
          description: "Represents one of three states of off-site information for the land: 0 = nothing is known about off-site attributes; 1 = 'All To Site' (all off-site amenities are set up to service the land); 2 = 'All Needed' (no off-site amenities are set up to service the land). Summarises off-site utilities: Unknown if the state is Unknown or unset; if Yes, AllToSite when every known improvement type is listed and Custom otherwise; if No, NoneToSite when none are listed and Custom otherwise."
        utilities:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyLandOffSiteImprovement"
          description: "Collection of off-site improvement records (utilities/roads reaching the site) describing development readiness. Off-site improvements from the land record."
        frontage:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyFrontage"
          description: "Collection of frontage records describing the land's road frontage; frontage and visibility are key land/retail-site attributes."
        offSiteImprovementExceptions:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyLandOffSiteImprovementException"
          description: "Collection of exceptions to off-site improvements (improvements not present/available to the site)."
    CommercialCompOwner:
      type: "object"
      properties:
        compId:
          type: "integer"
          format: "int32"
          description: "Identifier of the comp (sale/lease comparable) this ownership record belongs to; join on integer ID. Treated as 0 when the source value is missing."
    CommercialPropertyContact:
      type: "object"
      properties:
        compOwners:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialCompOwner"
          description: "Collection of comparable-sale ownership references (comp and comp-contact IDs) linking this property contact to ownership records in sale comps; ownership/financial linkage."
        contactId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the contact (agent) for the space. The contact may not be known, but in that case the brokerage company must be known."
        contactPhoneNumber:
          type: "string"
          nullable: true
          description: "Phone number of the contact. Particularly applicable to on-site contacts such as a property manager or building engineer."
        contactPhoneNumberCountryCode:
          type: "string"
          nullable: true
          description: "Country dialing code for the property contact's phone number."
        contactPhoneNumberExt:
          type: "string"
          nullable: true
          description: "Phone number extension for the contact."
        contactRole:
          allOf:
            - "$ref": "#/components/schemas/ContactRole"
          description: "Role of the contact on the space; artificial primary key generated via IDENTITY."
        endDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the contact becomes obsolete/finished for the property."
        id:
          type: "integer"
          format: "int32"
          description: "Artificial primary key for the property-contact record, generated via IDENTITY."
        locationId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The brokerage company represented by the specified agent. When the agent/contact is unknown, the brokerage company alone suffices. The brokerage company may differ from the company that actually employs the agent."
        percentOwned:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Ownership percentage attributed to this contact for the property; only owner roles (TrueOwner/RecordedOwner) carry it, and combined ownership cannot exceed 100% per role. Prefer the true owner for ownership questions."
        preferredPhoneType:
          allOf:
            - "$ref": "#/components/schemas/PhoneType"
          description: "Identifier for the preferred phone-number type, such as Contact Phone, Mobile, Fax, Other, or Override."
        startDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the contact becomes valid/current for the property. Some contacts, such as a building's architect, will have no start or end date."
    CommercialPropertyLeed:
      type: "object"
      properties:
        beginMonth:
          type: "integer"
          format: "int32"
          description: "Month the LEED certification's validity period begins."
        beginYear:
          type: "integer"
          format: "int32"
          description: "Year the LEED certification's validity period begins."
        endMonth:
          type: "integer"
          format: "int32"
          description: "Month the LEED certification's validity period ends."
        endYear:
          type: "integer"
          format: "int32"
          description: "Year the LEED certification's validity period ends."
        propertyLeedType:
          allOf:
            - "$ref": "#/components/schemas/PropertyLeedType"
          description: "LEED certification level awarded (Certified, Silver, Gold, Platinum); LEED is the top-priority green scheme and the most recent certification is displayed as '[level] certified since [Month Year]'."
    CommercialPropertyEnvironmental:
      type: "object"
      properties:
        leedCertifications:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyLeed"
          description: "Collection of the property's LEED certification records (green-building certifications by level and period)."
    CommercialPropertyPropertyFloorFloorSize:
      type: "object"
      properties:
        squareFeet:
          type: "number"
          nullable: true
          description: "Gross floor area (GBA for the floor): total area including mezzanine and basements, measured from the exterior surfaces of the building's outside walls (whole building, including shafts/elevators). Unknown floors are Null and substitute the typical floor size when drawing the stack. Square-foot value of the floor's gross floor size."
        source:
          allOf:
            - "$ref": "#/components/schemas/DataSourceType"
          description: "Gross floor area (GBA for the floor): total area including mezzanine and basements, measured from the exterior surfaces of the building's outside walls (whole building, including shafts/elevators). Unknown floors are Null and substitute the typical floor size when drawing the stack. Source of the floor's gross floor size measurement."
    CommercialPropertyPropertyFloor:
      type: "object"
      properties:
        propertyFloorId:
          type: "integer"
          format: "int32"
          description: "Number uniquely identifying a floor on any property."
        floorName:
          allOf:
            - "$ref": "#/components/schemas/FloorName"
          description: "Name of the floor (for example Ground, Mezzanine or a floor number)."
        floorSize:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyPropertyFloorFloorSize"
          nullable: true
          description: "Gross floor area (GBA for the floor): total area including mezzanine and basements, measured from the exterior surfaces of the building's outside walls (whole building, including shafts/elevators). Unknown floors are Null and substitute the typical floor size when drawing the stack. Gross floor size of the floor; null when the floor has none."
    CommercialPropertyPropertyResidence:
      type: "object"
      properties:
        numBeds:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of bedrooms in the residence; a primary residential attribute."
        numBaths:
          type: "number"
          nullable: true
          description: "Total number of bathrooms in the residence, fractional to allow half-baths."
        numFullBaths:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Count of full bathrooms (with shower or tub) in the residence."
        numHalfBaths:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Count of half bathrooms (toilet and sink only) in the residence."
        numGarageSpaces:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Number of garage parking spaces at the residence."
        numGarageSpacesPrecise:
          type: "number"
          nullable: true
          description: "Redundant with numGarageSpaces and intended to be retired."
        ceilingHeightMainInFeet:
          type: "number"
          nullable: true
          description: "Ceiling height of the main living level in feet; a desirability attribute."
        ceilingHeightUpperInFeet:
          type: "number"
          nullable: true
          description: "Ceiling height of the upper level in feet for multi-level residences."
        isModelHome:
          type: "boolean"
          nullable: true
          description: "Whether the residence is a builder's model/show home used to market a community rather than an occupied home."
        floorPlanId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Foreign key to the shared floor-plan record defining this residence's layout."
        propertyId:
          type: "integer"
          format: "int32"
          description: "Identifier of the residential property (single home or for-sale residence) this attribute set describes."
        residentialProfileId:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Foreign key to the parent residential/community profile the residence belongs to."
        unitNumber:
          type: "string"
          nullable: true
          description: "Unit/building number label for the residence."
        garageEntryType:
          allOf:
            - "$ref": "#/components/schemas/GarageEntryType"
          description: "Garage access/entry style for the residence (e.g. attached, detached, alley/front load)."
        homeParkingType:
          allOf:
            - "$ref": "#/components/schemas/HomeParkingType"
          description: "Code parking arrangement available at the residence (garage, surface, covered)."
        builderExternalIdentifier:
          type: "string"
          nullable: true
          description: "External builder/source-feed identifier for cross-referencing the residence to a builder's system."
    CommercialListingSummaryAddress:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Unique integer identifier of the address record; the stable key other entities join to when referencing this location."
        streetNumber:
          type: "string"
          nullable: true
          description: "Street (house) number portion of the street address, e.g. the 1200 in 1200 Main St."
        streetNumberEndRange:
          type: "string"
          nullable: true
          description: "Upper bound of the street-number range when the property spans multiple addresses, e.g. the 1210 in a 1200-1210 frontage."
        streetDirection:
          type: "string"
          nullable: true
          description: "Directional prefix or component of the street name such as N, SW, or East."
        streetName:
          type: "string"
          nullable: true
          description: "Name of the street the property fronts, e.g. Main in 1200 Main St."
        streetType:
          type: "string"
          nullable: true
          description: "Street thoroughfare type designation such as St, Ave, Blvd, or Rd."
        streetSuffix:
          type: "string"
          nullable: true
          description: "Trailing directional suffix of the street address, e.g. the NW in 1200 Main St NW."
        buildingNumber:
          type: "string"
          nullable: true
          description: "Building number identifying a specific structure within a multi-building site or campus at the address. Building number with surrounding spaces trimmed; blank becomes null."
        buildingName:
          type: "string"
          nullable: true
          description: "Marketing name of the building the listed space sits in, shown in listing displays. Taken from the listing's building name (trimmed, blank becomes null), not from the address record; only filled when the address exists."
        crossStreetDescription:
          type: "string"
          nullable: true
          description: "Free-text description of the nearest cross streets or intersection, used to locate or market the property by its corner or block. Not populated in this dataset; expect null."
        postalBox:
          type: "string"
          nullable: true
          description: "Post-office box designation for the address when mail is delivered to a PO box rather than the street location."
        city:
          type: "string"
          nullable: true
          description: "City name text of the address; an admin-geography label. Join to GeoEntities_City on cityId, never on this name string, since city names recur globally."
        countyId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Integer identifying the county, the largest geographical subdivision of most US states. The District of Columbia and Ontario are current exceptions. Not populated in this dataset; expect null."
        state:
          type: "string"
          nullable: true
          description: "State or province text of the address; an admin-geography label. Resolve via stateId rather than this string for joins."
        postcode:
          type: "string"
          nullable: true
          description: "Postal code of the address (international term for ZIP); part of admin geography. Postal code with surrounding spaces trimmed."
        countryCode:
          type: "string"
          nullable: true
          description: "Country code of the address; top-level admin-geography scope. Resolves to GeoEntities_Country and disambiguates globally recurring city/state names."
        latitude:
          type: "number"
          nullable: true
          description: "Geocoded latitude coordinate of the address used for mapping and spatial analysis; nullable when geocoding is unresolved."
        longitude:
          type: "number"
          nullable: true
          description: "Geocoded longitude coordinate of the address used for mapping and spatial analysis; nullable when geocoding is unresolved."
    AttachmentDimensions:
      type: "object"
      properties:
        width:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Width taken from the attachment's dimensions."
        height:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Height taken from the attachment's dimensions."
    OriginTag:
      type: "object"
      properties:
        cultureCode:
          type: "string"
          nullable: true
          description: "Not populated in this dataset; expect null."
        versionNumber:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Not populated in this dataset; expect null."
        preferredCulture:
          type: "string"
          nullable: true
          description: "Not populated in this dataset; expect null."
    CommercialListingNotesAttachmentReference:
      type: "object"
      properties:
        attachmentMasterId:
          type: "integer"
          format: "int32"
          description: "Identifies a file describing a given entity. The file can be any format, including document, spreadsheet, JPEG, GIF, Bitmap, etc."
        attachmentSource:
          allOf:
            - "$ref": "#/components/schemas/AttachmentSource"
          description: "The source where the attachment originated, such as Email, Fax, Field Researcher, Scan, or Standard Mail."
        attachmentType:
          allOf:
            - "$ref": "#/components/schemas/AttachmentType3"
          description: "Logical representation of the attachment. Values include: Aerial Photo, Argus Financial, Building Photo, Contract, Floor Plan, Investment Package, Image, iPIX Virtual Tour, Lobby, Locational Map, Logo, Outlook Contact Card, Photograph, Plat Map, Presentation, Spreadsheet."
        attachmentTypeExtension:
          allOf:
            - "$ref": "#/components/schemas/AttachmentTypeExtension2"
          description: "The file extension/type of the attachment (e.g., DOC, PDF, JPG, GIF, TIF, XLS, etc.)."
        caption:
          type: "string"
          nullable: true
          description: "Short description about the attachment."
        checkSum:
          type: "string"
          nullable: true
          description: "Content checksum of the attachment binary used for integrity/dedup (read-only from master)."
        cloudFolder:
          type: "string"
          nullable: true
          description: "Cloud storage folder/path where the attachment binary resides (read-only from master)."
        dimensions:
          allOf:
            - "$ref": "#/components/schemas/AttachmentDimensions"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Image size container copied from the attachment's dimensions."
        isMarketingPublished:
          type: "boolean"
          description: "Whether the attachment is published specifically for marketing surfaces (read-only from master). Not populated in this dataset; expect null."
        isPublished:
          type: "boolean"
          description: "Indicates whether clients are allowed to view the attachment."
        originatedByContactId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the person (contact) who created the attachment record."
        originationDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the attachment was created."
        originTag:
          allOf:
            - "$ref": "#/components/schemas/OriginTag"
          nullable: true
          description: "Not populated in this dataset; expect null."
        videoExternalReferenceType:
          allOf:
            - "$ref": "#/components/schemas/ExternalReferenceType3"
          description: "External-reference type indicating the video hosting provider/source for the videoKey."
        videoKey:
          type: "string"
          nullable: true
          description: "External key/identifier of the associated video asset, when the attachment is a video."
    CommercialListingSummaryCommercialListingNotes:
      type: "object"
      properties:
        attachments:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingNotesAttachmentReference"
          nullable: true
          description: "Attachments referenced by the note."
        header:
          type: "string"
          nullable: true
          description: "Display heading/title for the listing note shown above its content."
        noteType:
          allOf:
            - "$ref": "#/components/schemas/NoteType"
          description: "Kind of note."
        originTag:
          allOf:
            - "$ref": "#/components/schemas/OriginTag"
          nullable: true
          description: "Not populated in this dataset; expect null."
        value:
          type: "string"
          nullable: true
          description: "Text of the note."
    CommercialListingSummaryAuctionForSaleContact:
      type: "object"
      properties:
        contactEmail:
          type: "string"
          nullable: true
          description: "Direct email address of the individual contact for the auctioned for-sale property."
        contactFullName:
          type: "string"
          nullable: true
          description: "Full name of the individual contact (e.g. listing agent or seller representative) for the auctioned for-sale property."
        contactId:
          type: "integer"
          format: "int32"
          nullable: true
