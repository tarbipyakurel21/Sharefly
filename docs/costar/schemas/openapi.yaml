          format: "int32"
          nullable: true
          description: "Upper bound of the unit's rentable area in square feet."
        unitNumber:
          type: "string"
          nullable: true
          description: "Identifier label of the specific unit within the building (e.g. apartment/suite number)."
        unitName:
          type: "string"
          nullable: true
          description: "Display name of the unit or floor-plan model used in marketing."
        unitDescription:
