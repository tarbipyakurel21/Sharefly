          description: "Street name without its type."
        streetType:
          type: "string"
          nullable: true
          description: "Street type, such as `St`, `Ave` or `Blvd`."
        streetSuffix:
          type: "string"
          nullable: true
          description: "Direction after the street name, such as `SW`."
        buildingNumber:
          type: "string"
