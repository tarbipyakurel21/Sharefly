    LocationDetailAddress:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Id of the address. On most occupancies it equals the occupancy's `addressId`, and it matches an address id in commercial-property."
        buildingName:
          type: "string"
          nullable: true
          description: "Name of the building, such as `Century Plaza Towers North`."
        buildingNumber:
          type: "string"
          nullable: true
          description: "Building number or name within a complex, such as `2` or `Phoenix`."
        city:
          type: "string"
          nullable: true
          description: "City name as entered, so capitalization varies (`Houston`, `houston`)."
        cityId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "CoStar id of the city."
        countryCode:
          type: "string"
          nullable: true
          description: "Three-letter country code, such as `USA`."
        countyId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "CoStar id of the county."
        crossStreetDescription:
          type: "string"
          nullable: true
          description: "Nearest cross street or a short location note, such as `SWC FM 1960 W. & Falling Creek Dr.`. Usually empty."
        latitude:
          type: "number"
          nullable: true
          description: "Latitude of the address."
        longitude:
          type: "number"
          nullable: true
          description: "Longitude of the address."
        postcode:
          type: "string"
          nullable: true
          description: "Postal code. In the US this is the ZIP code."
        zip:
          type: "string"
          nullable: true
          description: "ZIP code, filled on older addresses. Prefer `postcode`."
        postalBox:
          type: "string"
          nullable: true
          description: "PO box number, on the few addresses that have one."
        state:
          type: "string"
          nullable: true
          description: "Two-letter state code, such as `TX` or `CA`."
        stateId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "CoStar id of the state."
        streetDirection:
          type: "string"
          nullable: true
          description: "Direction before the street name, such as `N` or `W`."
        streetName:
          type: "string"
          nullable: true
          description: "Street name without number, direction or type, such as `Wilshire`."
        streetNumber:
          type: "string"
          nullable: true
          description: "Street number, such as `1100`."
        streetNumberEndRange:
          type: "string"
          nullable: true
          description: "Last street number when the address covers a range, such as `1120` for 1100–1120."
        streetSuffix:
          type: "string"
          nullable: true
          description: "Direction after the street name, such as `E`."
        streetType:
          type: "string"
          nullable: true
          description: "Street type, such as `Blvd`, `St` or `Dr`."
    LocationDetailProfile:
      type: "object"
      properties:
        businessType:
          allOf:
            - "$ref": "#/components/schemas/BusinessType"
          description: "What kind of business the company is, from a real estate point of view, such as Brokerage, Lender or Retailer. `0` (Unknown) for most companies that are only tenants."
        businessSubtype:
          allOf:
            - "$ref": "#/components/schemas/BusinessSubtype"
          description: "A finer split of `businessType`, such as Brokerage_TenantRep. The name starts with its business type."
        industryType:
          allOf:
            - "$ref": "#/components/schemas/IndustryType"
          description: "Industry of the company. Use this, not the occupancy's `industryType`, once a tenant is known."
        websiteUrl:
          type: "string"
          nullable: true
          description: "Company website. A few links to business directories carry a fake phone number in the address, so they do not work."
        locationBio:
          type: "string"
          nullable: true
          description: "Description of the company, in English. Email addresses and phone numbers in it are fake."
        companyName:
          type: "string"
          nullable: true
          description: "Name of the company the location belongs to, such as `Prudential` for the location named `Prudential Financial`. Several locations share it."
        companyNameLocal:
          type: "string"
          nullable: true
          description: "The company name in a local spelling, on the few records that have one."
    LocationBrandProfile:
      type: "object"
      properties:
        corporateBrandId:
          type: "integer"
          format: "int32"
          description: "CoStar id of the brand."
        locationName:
          type: "string"
          nullable: true
          description: "Name of the location under that brand."
        locationPhone:
          type: "string"
          nullable: true
          description: "Phone number of the location under that brand. The number is fake, as in `locationPhone`."
        locationPhoneCountryCode:
          type: "string"
          nullable: true
          description: "Three-letter country code of `brandProfiles.locationPhone`."
    ApartmentListingAddress:
