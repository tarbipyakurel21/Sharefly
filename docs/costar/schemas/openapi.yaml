          allOf:
            - "$ref": "#/components/schemas/MarketAssessment"
          nullable: true
          description: "Value-typed market-valuation breakdown (market improvement, land, total value, and derived improvement percent) representing the assessor's estimated market value as distinct from the assessed/taxable value."
        parcelNumber:
          type: "string"
          nullable: true
          description: "County assessor's parcel number (APN) for the land parcel covered by this transfer document, tying the assessment to public tax/ownership records; APNs are unique only within a county."
        propertyTax:
          type: "number"
          nullable: true
