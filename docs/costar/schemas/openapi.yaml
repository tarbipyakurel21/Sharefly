          type: "integer"
          format: "int32"
          description: "Unique identifier for the transfer-document assessment record, which captures the assessor/tax valuation tied to a property's deed transfer within a commercial sale comp."
        isPartialAPNSale:
          type: "boolean"
          description: "Flag indicating the sale transaction covered only part of the assessor's parcel (APN) rather than the whole parcel, a comparability caveat when relating the assessment to the sale price."
