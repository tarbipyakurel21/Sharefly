        locationEmail:
          type: "string"
          nullable: true
          description: "Email address of the company/location for the auction for-sale contact; a business contact detail for the represented firm."
        locationId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the office location (company branch) in CoStar contact data."
        locationName:
          type: "string"
          nullable: true
          description: "Display name of the company/location associated with this auction for-sale contact (e.g. the brokerage or seller firm representing the auctioned property)."
        locationPhone:
          type: "string"
          nullable: true
          description: "Phone number of the company/location for the auction for-sale contact; a business contact detail for the represented firm."
        locationPhoneCountryCode:
          type: "string"
          nullable: true
          description: "International dialing country code for the company/location phone number."
    CommercialListingSummaryAuctionForSaleLot:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier for the auction for-sale lot record."
        lotNumber:
          type: "string"
          nullable: true
          description: "Lot number labeling this auction lot within the auction sale."
        lotDescription:
          type: "string"
          nullable: true
          description: "Free-text description of the auction lot and what is being sold."
        lotSize:
          type: "number"
          nullable: true
          description: "Measurement-valued size of the auction lot (area with unit of measure). Numeric value of the lot's size measurement; null when the lot has no size."
        lotSizeMeasurementType:
          allOf:
            - "$ref": "#/components/schemas/MeasurementUnit2"
