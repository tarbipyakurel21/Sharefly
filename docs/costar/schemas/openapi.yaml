          type: "array"
          items:
            "$ref": "#/components/schemas/TransferDocumentAssessment"
          nullable: true
          description: "Collection of per-document assessment records (assessed/market improvement, land, and total values) rolled up to support comp valuation."
        cityTax:
          type: "number"
          nullable: true
          description: "City-level transfer tax paid on the conveyance; additional tax-stamp basis that can corroborate price."
        countyId:
          type: "integer"
          format: "int32"
          description: "County whose recorder/assessor holds the document; scopes the document number, which is only unique within a county. Join to county geography on the ID."
        dateFiled:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the transfer document was recorded/filed with the county; recording date for the deed."
        documentNumber:
          type: "string"
          nullable: true
          description: "Normalized recording/document number identifying the deed in the county recorder's records, used to tie the sale to public records."
