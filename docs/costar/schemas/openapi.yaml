        contactPhone:
          type: "string"
          nullable: true
          description: "Direct phone number of the individual contact for the auctioned for-sale property."
        contactPhoneCountryCode:
          type: "string"
          nullable: true
          description: "International dialing country code for the individual contact's phone number."
        contactRole:
          allOf:
