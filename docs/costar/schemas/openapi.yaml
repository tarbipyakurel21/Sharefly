        apartmentLifestyleType:
          allOf:
            - "$ref": "#/components/schemas/ApartmentLifestyleType"
          description: "Code representing the demographic classification that a multi-family property caters to. Source value, or Unknown when no apartment record exists."
        apartmentOwnershipType:
          allOf:
            - "$ref": "#/components/schemas/ApartmentOwnershipType"
          description: "Code representing the kind of ownership of a multi-family property's building with respect to the units themselves. Source value, or Unknown when no apartment record exists."
        apartmentRentType:
          allOf:
            - "$ref": "#/components/schemas/ApartmentRentType"
          description: "Code for the rent classification of the multifamily property (e.g. market-rate vs Affordable, discounted to meet affordability standards); CoStar tracks distinct rent series and aggregates rents SF-weighted across types. Source value, or Unknown when no apartment record exists."
        affordableRentSubtype:
          allOf:
            - "$ref": "#/components/schemas/AffordableRentSubtype"
          description: "Code representing a sub-classification of affordable rent types; must be selected when the property's rent type is classified as 'Affordable'. Source value, or Unknown when no apartment record exists."
        affordableUnits:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of units offered at 'Affordable' rents. Only applies when the property's apartmentRentType is set to 'Affordable'."
