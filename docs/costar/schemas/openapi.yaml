          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of buildings in the apartment property. Duplicative column added (per D. Zucker) in anticipation of retiring PropertyApartmentBuilding; originated from PropertyApartmentBuilding.NumBldgs but made nullable."
        totalNumUnits:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Collection of active apartment floor-plan model records defining the community's unit mix (bed/bath layouts, counts, rents). Count of units listed across all of the property's apartment models; units listed directly on the property are not counted."
        totalNumMobileHomeHookups:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Not populated in this dataset; expect null."
        unitsPerAcre:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Residential density expressed as dwelling units per acre; a multifamily site-density / entitlement attribute analogous to land zoning density."
