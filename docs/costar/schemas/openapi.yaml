          description: "Measurement-valued size of the auction lot (area with unit of measure). Unit of the lot's size measurement; null when the lot has no size."
        askingPrice:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Not populated in this dataset; expect null."
        parcelNumbers:
          type: "array"
          items:
            type: "string"
          description: "List of parcel references (county assessor APNs) identifying the legal land parcels comprising the auction lot. Parcel numbers recorded on the lot, with empty entries dropped."
    CommercialListingSummaryAuctionForSaleSummary:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Identifier of the auction for-sale offering record tied to this listing on the auction platform."
        assetManager:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryAuctionForSaleContact"
          nullable: true
          description: "Collection of contact references (brokers, sellers, auction roles) associated with this auction. The first contact on the auction record whose role is assetManager; null when there is none."
        forSaleId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the for-sale offering associated with this listing when it is marketed for sale; a listing may be for lease and/or for sale."
        auctionStartDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date/time the auction for this offering opens for bidding."
        auctionEndDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date/time the auction for this offering closes to bidding."
        currentReserve:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Current reserve price on an auction offering, the minimum the seller will accept; an internal auction financial threshold."
        startingBid:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Opening bid amount for the auction offering, the floor at which bidding begins."
        saleStatus:
          allOf:
            - "$ref": "#/components/schemas/SaleStatus"
          description: "Status of the sale side of the listing (e.g. available, under contract, sold); the marketing/transaction state of the for-sale offering."
        saleType:
          allOf:
            - "$ref": "#/components/schemas/SaleType"
          description: "Sale type (Investment vs Owner/User), which drives which fields matter to the buyer (income/leases vs allowed use/operating cost) and how % Leased is computed for a for-sale-only listing."
        assetCount:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of properties included in the offering; greater than one for portfolio or multi-property sale listings."
        portfolioName:
          type: "string"
          nullable: true
          description: "Marketing name of the portfolio when multiple properties are offered together as a named bundle."
        portfolioType:
          allOf:
            - "$ref": "#/components/schemas/PortfolioType"
          nullable: true
          description: "Code classifying the portfolio nature of a multi-property offering; drives whether per-property prices are allocated estimates."
        condoUnitId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the specific condo unit being offered when the listing is a condo-unit for-sale offering."
        unitNumber:
          type: "string"
          nullable: true
          description: "Unit/suite number label of the specific space or condo unit being marketed within the building."
        unitSquareFeet:
          type: "number"
          nullable: true
          description: "Rentable area of the specific unit/space being listed in square feet; use RBA for lease economics."
        propertyFloorId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the building floor the listed space occupies, tying availability to a specific level."
        totalAvailableSquareFeet:
          type: "number"
          nullable: true
          description: "Total square footage marketed as available across the listing — space being marketed for lease/sale regardless of whether it is vacant, occupied, sublet, or available at a future date. Distinct from vacant SF; do not feed into a vacancy numerator."
        lots:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryAuctionForSaleLot"
          nullable: true
          description: "Collection of auction lots (individual sale parcels/units) making up the auction. Lots listed on the auction record; empty when there is no auction record."
    CommercialListingSummaryAttachmentReference:
      type: "object"
      properties:
        attachmentMasterId:
          type: "integer"
          format: "int32"
          description: "Identifies a file describing a given entity. The file can be any format, including document, spreadsheet, JPEG, GIF, Bitmap, etc."
        attachmentType:
          allOf:
            - "$ref": "#/components/schemas/AttachmentType3"
          description: "Logical representation of the attachment. Values include: Aerial Photo, Argus Financial, Building Photo, Contract, Floor Plan, Investment Package, Image, iPIX Virtual Tour, Lobby, Locational Map, Logo, Outlook Contact Card, Photograph, Plat Map, Presentation, Spreadsheet."
        attachmentTypeExtension:
          allOf:
            - "$ref": "#/components/schemas/AttachmentTypeExtension2"
          description: "The file extension/type of the attachment (e.g., DOC, PDF, JPG, GIF, TIF, XLS, etc.)."
        caption:
          type: "string"
          nullable: true
          description: "Short description about the attachment."
        attachmentUri:
          type: "string"
          nullable: true
          description: "Link to the attachment's file on CoStar's CDN, set on published attachments only. Image links are at size 112 (up to 1,880 by 900 pixels); replace the /112/ segment with another size id to get another size."
        dimensions:
          allOf:
            - "$ref": "#/components/schemas/AttachmentDimensions"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Image size container copied from the attachment's dimensions."
        originationDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the attachment was created."
        videoExternalReferenceType:
          allOf:
            - "$ref": "#/components/schemas/ExternalReferenceType3"
          description: "External-reference type indicating the video hosting provider/source for the videoKey."
        videoKey:
          type: "string"
          nullable: true
          description: "External key/identifier of the associated video asset, when the attachment is a video."
    CommercialListingSummaryContact:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the contact record on the listing."
        locationId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the office location (company branch) in CoStar contact data."
        firstName:
          type: "string"
          nullable: true
          description: "Contact's given (first) name; core personal identity field for a CRE individual such as a broker or agent."
        lastName:
          type: "string"
          nullable: true
          description: "Contact's family (last) name; core personal identity field."
        locationName:
          type: "string"
          nullable: true
          description: "Firm name used at this location. Should always be populated, even when identical to the company name."
        emailAddress:
          type: "string"
          nullable: true
          description: "Contact's primary email address; a key communication and lead-delivery channel for brokers and agents."
        phoneNumber:
          type: "string"
          nullable: true
          description: "Contact's primary office/business phone number, a main channel for reaching a broker or agent."
        phoneNumberCountryCode:
          type: "string"
          nullable: true
          description: "ISO/country dialing code for the primary phone number, supporting international formatting."
        phoneExt:
          type: "string"
          nullable: true
          description: "Telephone extension dialed after the primary phone number to reach the contact directly."
        contactRole:
          allOf:
            - "$ref": "#/components/schemas/ContactRole"
          description: "Role of the person or company on this record, such as listing broker, buyer or seller."
        displayInProduct:
          type: "boolean"
          nullable: true
          description: "Whether this contact should be publicly displayed in the marketed listing/product surface, vs kept internal-only."
    CommercialListingSummaryForLeaseLoadBay:
      type: "object"
      properties:
        driveInBayState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Indicating presence/availability of drive-in bays (grade-level doors) for the space."
        loadingDockState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Indicating presence/availability of loading docks for the leasable space; a key industrial logistics attribute."
        numDriveInBays:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Count of drive-in bays (grade-level doors vehicles enter directly) serving the leasable space; a key industrial/flex access attribute."
        numExternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Count of exterior loading docks serving the leasable space; core industrial loading capacity."
        numInternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Count of interior loading docks serving the leasable space."
    CommercialListingSummaryNotes:
      type: "object"
      properties:
        noteType:
          allOf:
            - "$ref": "#/components/schemas/NoteType"
          description: "A pre-defined categorization of note text, typically referred to as 'Notes' in CRM Enterprise."
        value:
          type: "string"
          nullable: true
          description: "The body (free-text content) of the note."
    CommercialListingSummaryForLeaseSpaceForLease:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Primary key of the space-for-lease record (a marketed unit of commercial space). These entities are processed together in the product refresh."
        propertyFloorId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the floor (on any property) that this space occupies; uniquely identifies a property floor. The space's property floor id; for non-exclusive (open) mandates it is taken from the underlying inventory space rather than the marketing copy."
        propertyId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Foreign key to the parent commercial property the space belongs to; the property anchors all CRE data. The space's property id; for non-exclusive (open) mandates it is taken from the underlying inventory space rather than the marketing copy."
        floorName:
          allOf:
            - "$ref": "#/components/schemas/FloorName"
          description: "Name of the floor from the property floor record. Spaces with no floor id (disconnected listings) use the floor name on the space itself, and so does a space whose floor record is an Unknown floor but whose own floor name is known."
        isFullFloor:
          type: "boolean"
          nullable: true
          description: "Whether the space includes the entire floor (needed because buildings may have non-uniform floor sizes). 0=No, 1=Yes, NULL=Unknown."
        suite:
          type: "string"
          nullable: true
          description: "Suite/unit address number of the space; allows numeric (e.g. 124, 2, 546) or alphanumeric (A1, 1-A, 23-B1) values. The data size for Suite/unitNumber should match across SpaceForLease, SpaceOccupied, and CondoUnit."
        availableOnDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date when the space can be occupied by a new tenant. Mutually exclusive with the availability-in-days value; if the availability identifier is NULL, this date cannot be NULL."
        availabilityType:
          allOf:
            - "$ref": "#/components/schemas/AvailabilityType"
          description: "Number of days' notice the current tenant must be given before a replacement tenant's lease start date for the same space. Mutually exclusive with SpaceAvailableOnDate; if SpaceAvailableOnDate is not NULL, this must be NULL."
        serviceType:
          allOf:
            - "$ref": "#/components/schemas/ServiceType"
          description: "Service/lease type governing which operating expenses are included in the rent (Triple Net, Full Service, Modified Gross, Single/Double Net, Plus Electric, FRI, etc.); allowed values vary by space type and country. Drives whether rents are comparable across spaces."
        spaceUse:
          allOf:
            - "$ref": "#/components/schemas/SpaceUse"
          description: "How the space will be used (Office, Office/Medical, Office/Retail, Medical, Retail, Flex, Industrial); gates which space-detail fields apply."
        spaceType:
          allOf:
            - "$ref": "#/components/schemas/SpaceType"
          description: "Type of space available: Relet (direct), New, Sublet, or Assignment. Direct leasing activity = relet + new; Sublet activity = sublet + assignment."
        isExecutiveSuite:
          type: "boolean"
          nullable: true
          description: "Whether the available space is an executive suite. Executive suites are rented by a company that may sublet to other parties; due to high turnover, CoStar does not track that subletting and tracks only the primary company renting the space."
        squareFeetMin:
          type: "number"
          nullable: true
          description: "Smallest amount of square footage the owner will lease."
        squareFeetMax:
          type: "number"
          nullable: true
          description: "Square footage the owner/listing agent advertises for the space. The advertised figure may differ from actual square footage, since it can be rounded to the nearest 10, 100, 1000 sf, etc."
        squareFeetMaxContiguous:
          type: "number"
          nullable: true
          description: "List of space IDs that combine to form this contiguous block; the combinable block, not a sum of all building spaces. Sum of the maximum square feet of the spaces in the same contiguous block that have no off-market date, counting every such space in the block (lease-pending included, and including spaces outside this listing). Without a block key it is the space's own maximum square feet, or 0 when that is missing. Off-market spaces in a block are not counted; 0 if the block is not found."
        rateLow:
          type: "number"
          description: "May blend component rates (e.g. warehouse + office). Distinct from contract or effective/net rent and not comparable across service types. Low end of the space's asking rate; 0 (not null) when no rate is recorded."
        rateHigh:
          type: "number"
          description: "May blend component rates (e.g. warehouse + office). Distinct from contract or effective/net rent and not comparable across service types. High end of the space's asking rate; 0 (not null) when no rate is recorded."
        rateBasis:
          allOf:
            - "$ref": "#/components/schemas/RateBasis"
          description: "May blend component rates (e.g. warehouse + office). Distinct from contract or effective/net rent and not comparable across service types. Period of the asking rate (Monthly or Yearly); Unknown when no rate is recorded."
        monetaryUnit:
          allOf:
            - "$ref": "#/components/schemas/MonetaryUnit"
          description: "Currency (monetary unit) of the space's rate and expense amounts; normalize before aggregating rents across spaces/markets."
        askingRateHasValue:
          type: "boolean"
          nullable: true
          description: "May blend component rates (e.g. warehouse + office). Distinct from contract or effective/net rent and not comparable across service types. Whether an asking rate was recorded at all."
        floorPlan:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryAttachmentReference"
          nullable: true
          description: "Collection of media attachment references (photos, floor plans) for the space listing. Most recent attachment of type floor plan on the space."
        marketingAddress:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryAddress"
          nullable: true
          description: "Foreign key to the marketing address for the space; the model embeds a full marketingAddress object rather than an id. Address record for the space's marketing address id; null when there is none. For non-exclusive (open) mandates it is the marketing copy's address."
        isLeasePending:
          type: "boolean"
          nullable: true
          description: "Indicates whether a lease is pending, is not pending, or does not exist. True only when the space's lease-pending state is Yes; false for No, Unknown or missing, never null."
        leasePendingDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the space was involved in leasing negotiations."
        dateOnMarket:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the space was listed for lease (anchors time-on-market). A tenant may still occupy the space when listed, e.g. when an owner pressures the current tenant to renew or expects them to vacate. If the true availability date is unknown, the researcher may enter the current or an estimated date; the field cannot be NULL."
        dateOffMarket:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the space was taken off the market; the last day on the market is exclusive of this value (the space was not on the market on the entered date). Set when a space is renovated, withheld, or used to pressure an existing tenant to renew. Caution: removing a space can drastically affect the SpaceAvailableGroup. NULL while the space is still on the market."
        leaseTermHigh:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Maximum amount of time (in months) the space can be leased. If non-NULL, leaseTermType must be non-NULL (Days, Months, or Years) and leaseTermLow must be non-NULL and <= leaseTermHigh. Mutually exclusive with leaseTermThru and the month-to-month flag."
        leaseTermLow:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Minimum amount of time (in months) the space can be leased. If non-NULL, leaseTermType must be non-NULL (Days, Months, or Years) and leaseTermHigh must be non-NULL and >= leaseTermLow. Mutually exclusive with leaseTermThru and the month-to-month flag."
        leaseTermThru:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the space's lease must end. Displayed as MM/YYYY but stored with the day set to the first of the month (chosen for consistency, since month-end varies). If non-NULL, mutually exclusive with leaseTermType, leaseTermLow, leaseTermHigh, and the month-to-month flag."
        leaseTermType:
          allOf:
            - "$ref": "#/components/schemas/LeaseTermType"
          description: "Measurable time unit for leaseTermLow/leaseTermHigh, or a state when units cannot be quantified. Values: Years, Months, Days, To Be Determined, Negotiable."
        loadBay:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryForLeaseLoadBay"
          nullable: true
          description: "Loading-bay detail object for the space (dock/drive-in loading characteristics); a core industrial logistics attribute set. Loading details of the space; always present, with Unknown states and null counts when the space has none."
        commonAreaMaintenanceAmount:
          type: "number"
          nullable: true
          description: "Common Area Maintenance (CAM) expense amount charged in addition to base rent; a pass-through operating cost (with taxes and insurance) the tenant bears under net leases. Surface alongside service type when comparing effective rents."
        commonAreaMaintenanceAmountPerYear:
          type: "number"
          nullable: true
          description: "Annualized Common Area Maintenance charge for the space."
        commonAreaMaintenanceState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Indicates whether common area maintenance exists, does not exist, or is unknown for the space."
        propertyTaxAmount:
          type: "number"
          nullable: true
          description: "Property-tax amount attributed to the space."
        propertyTaxAmountPerYear:
          type: "number"
          nullable: true
          description: "Annualized property-tax amount attributed to the space."
        propertyTaxState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "For property-tax applicability on the space."
        rentPlus:
          type: "number"
          nullable: true
          description: "Additional rent add-on amount on top of base rent (e.g. taxes/maintenance/insurance, TMI), increasing the tenant's effective cost."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryNotes"
          nullable: true
          description: "Collection of internal/research notes attached to the space record. Notes on the space."
        isInventoryOffMarket:
          type: "boolean"
          nullable: true
          description: "Date the space was taken off the market; the last day on the market is exclusive of this value (the space was not on the market on the entered date). Set when a space is renovated, withheld, or used to pressure an existing tenant to renew. Caution: removing a space can drastically affect the SpaceAvailableGroup. NULL while the space is still on the market. Only for non-exclusive (open) mandates: true when the underlying inventory space has an off-market date, false when it has none; null if the inventory space cannot be found. Always null for other mandates."
    CommercialListingSummaryForLeaseProperty:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of the commercial property; the asset is the anchor of all CRE data, and this is the join key for everything attached to it. Also the translation key."
        propertyType:
          allOf:
            - "$ref": "#/components/schemas/PropertyType"
          description: "Primary CRE asset class (Office, Industrial, Flex, Retail, Multifamily, Hospitality, Land, etc.); drives the type-specific attribute set and the analytic property-type slices used for vacancy/rent/absorption aggregation."
        constructionStatus:
          allOf:
            - "$ref": "#/components/schemas/ConstructionStatus"
          description: "Lifecycle status of the building (Proposed, Under Construction, Under Renovation, Existing, Abandoned, Demolished); non-existing statuses are excluded from existing inventory, vacancy, and absorption until actual delivery/move-in."
        address:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryAddress"
          nullable: true
          description: "Identifier of the property's primary address record; join on the integer ID to resolve geography. The property's primary address record; null when it has none."
        buildingName:
          type: "string"
          nullable: true
          description: "Proper name of the building used in marketing and identification."
        buildingSizeSquareFeet:
          type: "number"
          nullable: true
          description: "Rentable Building Area (RBA): area inside the walls excluding vertical shafts but including common areas — the leasing/revenue/investing basis and the vacancy denominator. RBA used for all uses except retail (which uses GLA); must be <= GBA. Rentable building area in square feet, or gross building area in square feet when rentable area is missing."
        primaryPhoto:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryAttachmentReference"
          nullable: true
          description: "Collection of media attachment references (photos, floor plans, documents) for the property used on marketing surfaces. The property's default property image."
        maxContiguousSquareFeet:
          type: "number"
          nullable: true
          description: "Square footage the owner/listing agent advertises for the space. The advertised figure may differ from actual square footage, since it can be rounded to the nearest 10, 100, 1000 sf, etc. Largest contiguous square feet among this property's spaces in the listing (see the space-level value); null when the property has no spaces."
        totalAvailableSquareFeet:
          type: "number"
          nullable: true
          description: "Square footage the owner/listing agent advertises for the space. The advertised figure may differ from actual square footage, since it can be rounded to the nearest 10, 100, 1000 sf, etc. Sum of the maximum square feet of this property's spaces. Spaces in a contiguous block count only if they are not off-market, but a stand-alone space with no block key counts even when it is off-market; 0 when the property has no spaces."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryNotes"
          nullable: true
          description: "Collection of internal notes/annotations attached to the property record; translatable, may hold research commentary. Notes on the property."
    CommercialListingSummaryNotes2:
      type: "object"
      properties:
        noteType:
          allOf:
            - "$ref": "#/components/schemas/NoteType"
          description: "A pre-defined categorization of note text, typically referred to as 'Notes' in CRM Enterprise."
        originTag:
          allOf:
            - "$ref": "#/components/schemas/OriginTag"
          nullable: true
          description: "Language and version tag copied from the note."
        value:
          type: "string"
          nullable: true
          description: "The body (free-text content) of the note."
    CommercialListingSummaryForLeaseLandForLease:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Identifier for an instance in which a piece of land was offered on the open market for lease."
        propertyId:
          type: "integer"
          format: "int32"
          description: "Foreign key to the parent land property being offered for lease."
        isOutparcelPad:
          type: "boolean"
          description: "Indicates whether the land is an outparcel pad. 1 = True, 0 = False; defaults to 0."
        leaseTermLow:
          type: "number"
          nullable: true
          description: "Minimum amount of time the land can be leased. If set, leaseTermType must give the unit (Days, Months, or Years) and leaseTermHigh must be set and greater than or equal to this value. Mutually exclusive of leaseTermThru and the month-to-month flag."
        leaseTermHigh:
          type: "number"
          nullable: true
          description: "Maximum amount of time the land can be leased. If set, leaseTermType must give the unit (Days, Months, or Years) and leaseTermLow must be set and less than or equal to this value. Mutually exclusive of leaseTermThru and the month-to-month flag."
        leaseTermType:
          allOf:
            - "$ref": "#/components/schemas/LeaseTermType"
          description: "Represents the unit of time in which the land can be leased (e.g. Days, Months, Years), qualifying leaseTermLow and leaseTermHigh."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryNotes2"
          nullable: true
          description: "Collection of internal notes attached to the land-for-lease record. Notes on the land-for-lease record."
    CommercialListingSummaryForLease:
      type: "object"
      properties:
        serviceType:
          allOf:
            - "$ref": "#/components/schemas/ServiceType"
          description: "Code classifying the listing's transaction service (e.g. for lease vs for sale arrangement) used to route and filter the offering."
        spaceCount:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of distinct lease spaces marketed under the listing; indicates how much availability the listing aggregates."
        assetCount:
          type: "integer"
          format: "int32"
          description: "Number of properties included in the offering; greater than one for portfolio or multi-property sale listings."
        minDivisibleSquareFeet:
          type: "number"
          nullable: true
          description: "Smallest contiguous area a tenant can lease from the listing in square feet; the minimum bite size a larger space can be subdivided into for marketing to smaller tenants."
        maxContiguousSquareFeet:
          type: "number"
          nullable: true
          description: "Largest single combinable block of space available in square feet — the true contiguous (contiguous-in-building) max, the sum of contiguous spaces, rather than a naive sum of all unconnected spaces."
        totalAvailableSquareFeet:
          type: "number"
          nullable: true
          description: "Total square footage marketed as available across the listing — space being marketed for lease/sale regardless of whether it is vacant, occupied, sublet, or available at a future date. Distinct from vacant SF; do not feed into a vacancy numerator."
        askingRateLow:
          type: "number"
          nullable: true
          description: "Lowest asking (face) lease rate quoted across the listing's spaces, in the listing's rate basis; an asking-flavor rent, not contract or effective, and not comparable across service types without grossing-up/normalizing."
        askingRateHigh:
          type: "number"
          nullable: true
          description: "Highest asking (face) lease rate quoted across the listing's spaces, in the listing's rate basis; an asking flavor — normalize service type (NNN vs gross) and per-SF/yr before comparing rents."
        askingRateBasis:
          allOf:
            - "$ref": "#/components/schemas/RateBasis"
          description: "Rent service type/basis governing the asking rate (e.g. NNN/triple-net, FSG/full-service-gross, modified gross) — who pays which operating expenses. Rates are not comparable across bases without normalizing (e.g. grossing a net rate up to full-service)."
        askingRateMeasurementType:
          allOf:
            - "$ref": "#/components/schemas/MeasurementUnit2"
          description: "Size basis the asking rate is measured against (e.g. per SF per year vs per month), needed to interpret and normalize the rate. Per-acre rates are reported as Acres and per-square-foot rates as squareFeet; any other basis is Unknown."
        vacancyLoss:
          type: "number"
          nullable: true
          description: "Vacancy/collection-loss allowance deducted in the income waterfall (gross potential/base rent + reimbursements + other income, less this loss = Effective Gross Income); an underwriting input reflecting expected uncollected rent."
        spaces:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryForLeaseSpaceForLease"
          description: "One entry per space. All spaces are listed, including off-market and lease-pending ones. For non-exclusive (open) mandates the entries are the listing's own marketing copies of the spaces; otherwise they are the inventory spaces. Sorted by floor order, then suite name, then id."
        properties:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryForLeaseProperty"
          description: "Properties of the listing's property group, only fetched for building-park and shopping-center lease listings, so empty for all other lease types. The group's primary property comes first, then non-land properties by building size (largest first), then land by id."
        lands:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryForLeaseLandForLease"
          description: "Land-for-lease records attached to the listing, only for for-lease listing types."
        minDateOnMarket:
          type: "string"
          format: "date-time"
          nullable: true
          description: "The date a ForSale item (Property, Land, or CondoUnit) goes on the market. Anchors marketing duration and on-market status. Earliest on-market date across the listing's for-sale records if it has any, otherwise across its for-lease spaces, otherwise across its land-for-lease records; null when none has a date. Uses inventory records, including off-market ones."
    CommercialListingSummaryForSaleLot:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of the for-sale lot record (a parcel of land or subdivision lot offered for sale); also serves as the translation key for the lot's translatable fields."
        lotNumber:
          type: "string"
          nullable: true
          description: "The lot's identifying number/label within a subdivision or development, used to reference the specific parcel being offered for sale. Lot number with surrounding spaces trimmed."
        lotDescription:
          type: "string"
          nullable: true
          description: "Free-text marketing description of the for-sale lot and its features; translatable."
        lotSize:
          type: "number"
          nullable: true
          description: "Measurement of the lot's size (e.g. acreage or square footage); a primary land attribute driving value and permitted use. Numeric value of the lot's size measurement; null when the lot has no size."
        lotSizeMeasurementType:
          allOf:
            - "$ref": "#/components/schemas/MeasurementUnit2"
          nullable: true
          description: "Measurement of the lot's size (e.g. acreage or square footage); a primary land attribute driving value and permitted use. Unit of the lot's size measurement; null when the lot has no size."
        askingPrice:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The asking sale price for the lot; the lessor/seller's quoted price for the land parcel."
        parcelNumbers:
          type: "array"
          items:
            type: "string"
          description: "Collection of parcel references (county + assessor's parcel number) identifying the legal land parcels comprising this for-sale lot, tying it to public tax/ownership records. Parcel numbers recorded on the lot, with empty entries dropped."
    CommercialListingSummaryForSaleCondoUnitFloor:
      type: "object"
      properties:
        propertyFloorId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the property floor this condo unit occupies; joins to the floor record."
        unitSquareFeet:
          type: "number"
          nullable: true
          description: "Floor area of the condo unit on this floor in square feet."
        spaceUse:
          allOf:
            - "$ref": "#/components/schemas/SpaceUse"
          description: "Code classifying how the unit's space on this floor is used (e.g. office, retail, residential)."
        floorName:
          allOf:
            - "$ref": "#/components/schemas/FloorName"
          description: "A number representing a standardized floor name."
    CommercialListingSummaryForSaleCondoUnit:
      type: "object"
      properties:
        condoUnitId:
          type: "integer"
          format: "int32"
          description: "Id of the condo unit offered for sale."
        unitNumber:
          type: "string"
          nullable: true
          description: "The condo unit number. Data size should match Suite/unitNumber across SpaceForLease, SpaceOccupied, and CondoUnit."
        unitSquareFeet:
          type: "number"
          nullable: true
          description: "Size of the condo unit in square feet. For CRE area measures, RBA (rentable building area) is the leasing/revenue basis; square-feet values are integers in product. May be derived from the per-floor breakdown when Floors is populated."
        spaceUse:
          allOf:
            - "$ref": "#/components/schemas/SpaceUse"
          description: "Code classifying the unit's space use (office, retail, industrial, etc.); space-use gates which detail fields apply and drives analytic property-type slicing."
        floorName:
          allOf:
            - "$ref": "#/components/schemas/FloorName"
          description: "Same floor-name rule as for lease spaces: the property floor record's name, or the unit's own floor name when it has no floor id or its floor record is an Unknown floor."
        forSaleId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Artificial primary key of the for-sale offering record, generated via IDENTITY. Identifies the sale terms under a commercial listing. Id of the for-sale record used to price the unit: the marketing for-sale record for non-exclusive (open) mandates, otherwise the inventory record; null if not found."
        askingPriceLow:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Lower range of the sale price requested by the seller; most pertinent to portfolio sales. (Model-managed; in CRE usage maintained from lot-level prices when present.) Taken from the for-sale record chosen to price the unit (marketing record for non-exclusive mandates, otherwise inventory); null when no record is found."
        askingPriceHigh:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Upper range of the sale price requested by the seller; most pertinent to portfolio sales. (Model-managed; in CRE usage derived from lot asking prices when lots are priced.) Taken from the for-sale record chosen to price the unit (marketing record for non-exclusive mandates, otherwise inventory); null when no record is found."
        capitalizationRate:
          type: "number"
          nullable: true
          description: "Capitalization rate — net operating income divided by current market value, expressed as a percent; a measure of risk and yield where lower cap rates signal lower risk/higher value. In UK/France this field carries Yield (NOI inclusive of acquisition costs) under a relabeled display. Nullable; not all properties have one, especially Land. Taken from the for-sale record chosen to price the unit (marketing record for non-exclusive mandates, otherwise inventory); null when no record is found."
        netOperatingIncome:
          type: "number"
          nullable: true
          description: "Net Operating Income (Effective Gross Income minus operating expenses and taxes) attributed to the property; the income basis for the cap rate (NOI / value) and a core investment-sale underwriting input. Taken from the for-sale record chosen to price the unit (marketing record for non-exclusive mandates, otherwise inventory); null when no record is found."
        saleStatus:
          allOf:
            - "$ref": "#/components/schemas/SaleStatus"
          description: "Market status of the offering (Active, Escrow, Pending, UnderContract, Sold); on-market statuses are mutually exclusive with an off-market date. Sale status from the for-sale record chosen to price the unit; Unknown when no record is found."
        address:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryAddress"
          nullable: true
          description: "If NULL, the condo's address is the PRIMARY address of the associated property. The unit's own address record; null when it has none."
        isInventoryOffMarket:
          type: "boolean"
          nullable: true
          description: "The date a ForSale item (Property, Land, or CondoUnit) is taken off the market, either through a sale or owner withdrawal. Presence flips the listing to an off-market status. True when the inventory for-sale record has an off-market date, false when it has none; null if the inventory record cannot be found."
        monetaryUnit:
          allOf:
            - "$ref": "#/components/schemas/MonetaryUnit"
          nullable: true
          description: "Identifier of the currency for the offering's monetary values; must be normalized (per the platform's currency-conversion rules) before aggregating prices across offerings. Currency of the for-sale record chosen to price the unit."
        brokerOpinionOfValueLow:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Lower bound of the broker's opinion of value (BOV) for the property — an estimated (not transacted) valuation distinct from cap-rate-derived value. Model-managed, internal setter. Taken from the for-sale record chosen to price the unit (marketing record for non-exclusive mandates, otherwise inventory); null when no record is found."
        brokerOpinionOfValueHigh:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Upper bound of the broker's opinion of value (BOV) for the property — an estimated (not transacted) valuation. Model-managed, internal setter. Taken from the for-sale record chosen to price the unit (marketing record for non-exclusive mandates, otherwise inventory); null when no record is found."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryNotes"
          nullable: true
          description: "Collection of internal notes/annotations attached to the condo unit record. Notes on the condo unit."
        floors:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryForSaleCondoUnitFloor"
          nullable: true
          description: "Collection of per-floor breakdown records for the condo unit when it spans multiple floors; each carries its own square footage and space use. Floors the condo unit spans, one entry each."
    CommercialListingSummaryForSale:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the for-sale offering associated with this listing when it is marketed for sale; a listing may be for lease and/or for sale."
        assetCount:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of properties included in the offering; greater than one for portfolio or multi-property sale listings."
        saleStatus:
          allOf:
            - "$ref": "#/components/schemas/SaleStatus"
          description: "Status of the sale side of the listing (e.g. available, under contract, sold); the marketing/transaction state of the for-sale offering."
        askingPriceHigh:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Highest asking sale price for the for-sale listing; asking flavor, qualify against actual sale comps."
        askingPriceLow:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Lowest asking sale price for the for-sale listing; an asking figure, not a sold/transacted price, so flag confidence when comparing to comps."
        capitalizationRate:
          type: "number"
          nullable: true
          description: "Cap rate for the for-sale offering: Net Operating Income divided by the property's price/value; lower implies higher price relative to income. In UK/France this same field is labelled 'Yield' (yield divides by price plus acquisition costs). Flag whether actual or proforma."
        netOperatingIncome:
          type: "number"
          nullable: true
          description: "Net Operating Income of the property: Effective Gross Income (income less vacancy/collection loss) minus total operating expenses; the core income input for cap-rate valuation. Flag actual vs proforma/underwritten."
        condoUnitId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the specific condo unit being offered when the listing is a condo-unit for-sale offering."
        unitNumber:
          type: "string"
          nullable: true
          description: "Unit/suite number label of the specific space or condo unit being marketed within the building."
        unitSquareFeet:
          type: "number"
          nullable: true
          description: "Rentable area of the specific unit/space being listed in square feet; use RBA for lease economics."
        propertyFloorId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the building floor the listed space occupies, tying availability to a specific level."
        spaceUse:
          allOf:
            - "$ref": "#/components/schemas/SpaceUse"
          description: "Allowed/intended use of the listed space, refining what business or function the space supports."
        propertyResidentialId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the residential property record when the listed asset is a residential (e.g. resimercial/multifamily) property."
        propertyResidentialType:
          allOf:
            - "$ref": "#/components/schemas/PropertyResidentialType"
          nullable: true
          description: "Residential-property classification of the subject when residential, distinguishing the residential asset subtype. Residential property type from the listing summary; null when it is Unknown."
        totalAvailableSquareFeet:
          type: "number"
          nullable: true
          description: "Total square footage marketed as available across the listing — space being marketed for lease/sale regardless of whether it is vacant, occupied, sublet, or available at a future date. Distinct from vacant SF; do not feed into a vacancy numerator."
        saleType:
          allOf:
            - "$ref": "#/components/schemas/SaleType"
          description: "Sale type (Investment vs Owner/User), which drives which fields matter to the buyer (income/leases vs allowed use/operating cost) and how % Leased is computed for a for-sale-only listing."
        availableOnDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the space becomes available for occupancy; may be future-dated, since available space includes future-available."
        availabilityType:
          allOf:
            - "$ref": "#/components/schemas/AvailabilityType"
          description: "Space provenance of the offered space: Direct includes relet and new space, Sublet includes sublet and assignment space (product 'Direct' maps to Relet). Drives leasing-activity and direct-vs-sublet rent rollups."
        squareFeetNewOwnerCanOccupy:
          type: "number"
          nullable: true
          description: "Square footage a new owner could occupy themselves; relevant to owner/user sales weighing self-occupancy versus leased income."
        lots:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryForSaleLot"
          description: "Collection of land/parcel lots included in the offering; lot asking prices drive the derived askingPriceLow/High and define what land is being sold. Lots only for Land For Sale listings (empty for every other type). For non-exclusive (open) mandates they come from the listing's marketing for-sale records, otherwise from the inventory for-sale records. Sorted by lot id."
        units:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryForSaleCondoUnit"
          description: "Condo units only for Consolidated Condo For Sale and Disconnected Condo For Sale listings (empty for every other type, including single Condo For Sale). One entry per condo unit on the listing's for-sale records; units whose record cannot be found are dropped. Sorted by condo unit id."
        portfolioType:
          allOf:
            - "$ref": "#/components/schemas/PortfolioType"
          description: "Code classifying the portfolio nature of a multi-property offering; drives whether per-property prices are allocated estimates."
        portfolioName:
          type: "string"
          nullable: true
          description: "Marketing name of the portfolio when multiple properties are offered together as a named bundle."
        minDateOnMarket:
          type: "string"
          format: "date-time"
          nullable: true
          description: "The date a ForSale item (Property, Land, or CondoUnit) goes on the market. Anchors marketing duration and on-market status. Earliest on-market date across the listing's for-sale records; null when none has a date."
        isInventoryOffMarket:
          type: "boolean"
          nullable: true
          description: "The date a ForSale item (Property, Land, or CondoUnit) is taken off the market, either through a sale or owner withdrawal. Presence flips the listing to an off-market status. Only set for non-exclusive (open) Land For Sale and Property For Sale listings: true when the first inventory for-sale record has an off-market date, otherwise null (never false)."
    CommercialListingSummaryPropertyContact:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Artificial primary key for the property-contact record, generated via IDENTITY."
        contactId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the person in CoStar contact data."
        locationId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the office location (company branch) in CoStar contact data."
        firstName:
          type: "string"
          nullable: true
          description: "Contact's given (first) name; core personal identity field for a CRE individual such as a broker or agent."
        lastName:
          type: "string"
          nullable: true
          description: "Contact's family (last) name; core personal identity field."
        locationName:
          type: "string"
          nullable: true
          description: "Firm name used at this location. Should always be populated, even when identical to the company name."
        emailAddress:
          type: "string"
          nullable: true
          description: "Contact's primary email address; a key communication and lead-delivery channel for brokers and agents."
        phoneNumber:
          type: "string"
          nullable: true
          description: "Contact's primary office/business phone number, a main channel for reaching a broker or agent."
        phoneNumberCountryCode:
          type: "string"
          nullable: true
          description: "ISO/country dialing code for the primary phone number, supporting international formatting."
        phoneExt:
          type: "string"
          nullable: true
          description: "Telephone extension dialed after the primary phone number to reach the contact directly."
        contactRole:
          allOf:
            - "$ref": "#/components/schemas/ContactRole"
          description: "Role of the person or company on this record, such as listing broker, buyer or seller."
    LeaseRate:
      type: "object"
      properties:
        rateLow:
          type: "number"
          nullable: true
          description: "Low end of the asking rent range."
        rateHigh:
          type: "number"
          nullable: true
          description: "High end of the asking rent range; equal to rateLow when a single rate was quoted."
        rateBasis:
          allOf:
            - "$ref": "#/components/schemas/RateBasis"
          description: "Period the asking rent is quoted for (monthly or yearly)."
    LeaseBreakDate:
      type: "object"
      properties:
        breakDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date on which the lease may be broken/early-terminated under this option; key to rollover risk and income-durability analysis."
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of a lease break/termination-option record within a lease deal."
        leaseBreakType:
          allOf:
            - "$ref": "#/components/schemas/LeaseBreakType"
          description: "Code classifying the break-option type (e.g. tenant break, landlord break, mutual), describing who may early-terminate the lease and under what option."
        noticePeriodMonths:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Number of months of advance notice required to exercise the break option before the break date."
        terminationPenalty:
          type: "string"
          nullable: true
          description: "Free-text description of the penalty or fee payable to exercise the early-termination/break option."
    LeaseDealConcession:
      type: "object"
      properties:
        concessionAmount:
          type: "number"
          nullable: true
          description: "Monetary value of the landlord concession (inducement) granted to the tenant; reduces effective rent in lease-economics calculations."
        concessionAmountType:
          allOf:
            - "$ref": "#/components/schemas/LandlordConcessionAmountType"
          description: "Unit/basis of the landlord concession amount (e.g. per square foot, total, per month), needed to normalize the inducement's value."
        concessionDescription:
          type: "string"
          nullable: true
          description: "Free-text description of the landlord concession (e.g. moving allowance, fit-out contribution) beyond standard TI and free rent."
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of a landlord-concession record within a lease deal."
    LeaseDealContact:
      type: "object"
      properties:
        contactId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the person in CoStar contact data."
        contactPhoneNumber:
          type: "string"
          nullable: true
          description: "Phone number for the lease-deal contact (e.g. broker or party to the deal); personal contact data."
        contactPhoneNumberExt:
          type: "string"
          nullable: true
          description: "Phone extension the contact prefers for discussing the stated space. A non-NULL value overrides the contact's usual phone number; added to accommodate the existing phone-extension naming convention."
        contactRole:
          allOf:
            - "$ref": "#/components/schemas/ContactRole2"
          description: "Role of the person or company on this record, such as listing broker, buyer or seller."
        locationId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The contact's location - the main work location of the contact."
        preferredPhoneType:
          allOf:
            - "$ref": "#/components/schemas/PhoneType"
          description: "Code identifying the contact's preferred phone-number type, such as Contact Phone, Mobile, Fax, Other, or Override."
    LeaseDealFreeRentSchedule:
      type: "object"
      properties:
        calendarMonth:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Calendar month (1-12, where 1=January through 12=December) in which the free rent applies."
        calendarYear:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The calendar year in which the free-rent term applies."
        freeRentPercent:
          type: "number"
          nullable: true
          description: "Percentage of rent that is free (abated) during the scheduled term."
        id:
          type: "integer"
          format: "int32"
          description: "Primary key enforcing uniqueness of a free-rent schedule entry within a lease deal's concession terms."
        intervalMonthCount:
          type: "number"
          nullable: true
          description: "Number of months over which this free-rent entry recurs/spreads, describing how the abatement is distributed across the term."
        leaseMonth:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The month, counted from when the lease actually began, to which this free-rent term applies."
    Note:
      type: "object"
      properties:
        noteType:
          allOf:
            - "$ref": "#/components/schemas/NoteType"
          description: "A pre-defined categorization of note text, typically referred to as 'Notes' in CRM Enterprise."
        value:
          type: "string"
          nullable: true
          description: "The body (free-text content) of the note."
    LeaseDealRateEscalation:
      type: "object"
      properties:
        cpiAnnualMaxPercent:
          type: "number"
          nullable: true
          description: "Cap on the annual CPI-driven rent increase (collar maximum), limiting the bump regardless of how high CPI runs."
        cpiAnnualMinPercent:
          type: "number"
          nullable: true
          description: "Floor on the annual CPI-driven rent increase (collar minimum), guaranteeing a minimum bump regardless of how low CPI runs."
        escalationAmount:
          type: "number"
          nullable: true
          description: "Fixed dollar amount of the rate escalation. Nullable, because when an EscalationPct is specified the escalationAmount may not necessarily apply."
        escalationPercent:
          type: "number"
          nullable: true
          description: "Percentage of the rate escalation. Nullable, because when an escalationAmount is specified the EscalationPct may not necessarily apply."
        fromLeaseDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Calendar date on which this escalation step begins, an alternative to fromLeaseMonth for anchoring the bump to an absolute date."
        fromLeaseMonth:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Start of the negotiated term during which the rate escalation applies. A unique constraint on LeaseDealID, RateEscalationTypeID, fromLeaseMonth, and toLeaseMonth prevents multiple rows for the same term on a given lease deal and escalation type."
        id:
          type: "integer"
          format: "int32"
          description: "Surrogate primary key of the rate-escalation record, added to simplify updating and deleting records."
        intervalMonthCount:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of months between recurring applications of this escalation when it repeats, e.g. an annual bump is a 12-month interval."
        isRepeatToEnd:
          type: "boolean"
          description: "Whether this escalation step repeats on its interval through the end of the lease term rather than applying just once."
        pctOfMarketRate:
          type: "number"
          nullable: true
          description: "Percentage of prevailing market rent to which rent is reset at this escalation, used for market-rate (fair-market-value) review escalations."
        percentOfCpiInputRate:
          type: "number"
          nullable: true
          description: "Percentage of the Consumer Price Index movement applied as the rent increase for a CPI-indexed escalation, e.g. 80 percent of CPI."
        rateActualAfterEscalation:
          type: "number"
          nullable: true
          description: "Resulting actual contract rent rate after this escalation has been applied; the stepped-up rent figure feeding effective-rent calculations."
        rateEscalationAmountType:
          allOf:
            - "$ref": "#/components/schemas/RateEscalationAmountType"
          description: "Unit/basis for the escalation amount (e.g. per square foot, per month, total), needed to normalize the bump into a comparable rent figure."
        rateEscalationType:
          allOf:
            - "$ref": "#/components/schemas/RateEscalationType"
          description: "Code describing if and how the contract rent steps up over the term (escalation method) — e.g. fixed periodic bumps, CPI-indexed, or market-rate reviews. Displayed as a single escalation % with pattern, or 'Varying' for multiple steps."
        toLeaseMonth:
          type: "integer"
          format: "int32"
          nullable: true
          description: "End of the negotiated term during which the rate escalation applies. A unique constraint on LeaseDealID, RateEscalationTypeID, fromLeaseMonth, and toLeaseMonth prevents multiple rows for the same term on a given lease deal and escalation type."
    LeaseReviewDate:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of a lease review-date record within a lease deal."
        leaseReviewType:
          allOf:
            - "$ref": "#/components/schemas/LeaseReviewType"
          description: "Code classifying the type of scheduled lease review (e.g. rent review / market-rent review), describing the contractual review event."
        reviewDate:
          type: "string"
          format: "date-time"
          description: "Date of a scheduled lease (rent) review at which contract rent may be reset to market; common in UK leases. Surfaced on the Lease Comps financial terms as a rent-review pattern plus date(s)."
    LeaseDeal:
      type: "object"
      properties:
        askingRate:
          allOf:
            - "$ref": "#/components/schemas/LeaseRate"
          nullable: true
          description: "Lessor's quoted asking rent for the space as a low/high per-SF range with rate basis; the asking rent flavor, distinct from contract and effective."
        askingRatePerMonth:
          type: "number"
          nullable: true
          description: "Asking rent expressed as a per-month total; mutually exclusive with the per-year and per-SF forms, set when an asking amount is entered."
        askingRatePerYear:
          type: "number"
          nullable: true
          description: "Asking rent expressed as a per-year total; mutually exclusive with the per-month and per-SF forms, set when an asking amount is entered."
        breakDates:
          type: "array"
          items:
            "$ref": "#/components/schemas/LeaseBreakDate"
          nullable: true
          description: "Collection of UK lease break dates at which the tenant may terminate early; rollover-risk inputs. State exposed separately via breakDatesState."
        breakDatesState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "For the UK break-dates collection (early-exit points) on the lease."
        businessRatesPerYear:
          type: "number"
          nullable: true
          description: "Annual UK business rates (occupier property tax levied by the local authority) payable on the leased premises; a tenant occupancy cost shown on the Lease Comps financial terms as $/SF/Year."
        commencementDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the lease term begins; anchors term, free-rent and escalation schedules and is derived from sign or move-in date for renewals."
        concessions:
          type: "array"
          items:
            "$ref": "#/components/schemas/LeaseDealConcession"
          nullable: true
          description: "Collection of landlord concession records (TI allowances, free rent, other inducements) granted to the tenant that lower effective rent."
        contacts:
          type: "array"
          items:
            "$ref": "#/components/schemas/LeaseDealContact"
          nullable: true
          description: "Collection of contacts on the deal (landlord/leasing-company and tenant representatives)."
        effectiveRate:
          type: "number"
          nullable: true
          description: "User-entered effective rent per SF: NPV of net lease payments less TIA and other concessions, amortized over the term. The effective-rent flavor (never mix with asking or contract); can be negative when concessions exceed base rent."
        effectiveRateBasis:
          allOf:
            - "$ref": "#/components/schemas/RateBasis"
          description: "Time basis (monthly/yearly) of the user-entered effective rate, needed to normalize effective rent to a common basis."
        effectiveRateCalculatedBasis:
          allOf:
            - "$ref": "#/components/schemas/RateBasis"
          description: "Time basis of the system-calculated effective rate, populated from the effective-rent calculation result rather than user entry."
        effectiveRatePerMonth:
          type: "number"
          nullable: true
          description: "User-entered effective rent expressed as a per-month total, the per-month form of the concession-and-escalation-adjusted effective rent."
        effectiveRatePerYear:
          type: "number"
          nullable: true
          description: "User-entered effective rent expressed as a per-year total, the per-year form of the concession-and-escalation-adjusted effective rent."
        expansionOptionComment:
          type: "string"
          nullable: true
          description: "Free-text comment describing the expansion-option terms."
        expansionOptionDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the tenant may exercise the expansion option."
        expansionOptionSquareFeet:
          type: "number"
          nullable: true
          description: "Square footage covered by the tenant's expansion option."
        expansionOptionState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Whether the tenant holds an option to expand into additional space."
        expirationDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the lease term ends, derived from commencement date plus lease term (or earliest off-market sublet space)."
        freeMonths:
          type: "number"
          nullable: true
          description: "Number of free-rent (abated) months granted as a concession; an inducement that lowers effective rent. Displayed as 'XX Months at Start/End' or 'XX Months Total, Varying'. In the UK methodology free months are taken net of the 3-month fit-out period."
        freeRentMethodType:
          allOf:
            - "$ref": "#/components/schemas/FreeRentMethodType"
          nullable: true
          description: "Method of applying free rent (e.g. months at start versus a detailed schedule), set automatically from free months and the schedule."
        freeRentSchedule:
          type: "array"
          items:
            "$ref": "#/components/schemas/LeaseDealFreeRentSchedule"
          nullable: true
          description: "Collection of free-rent schedule entries detailing which lease months carry free or discounted rent; a concession schedule feeding effective-rent calculation."
        grossAggregateValue:
          type: "number"
          nullable: true
          description: "Total gross value of the lease deal over its term before concessions; an aggregate deal-value figure used to size the transaction."
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of the lease deal (lease comp) record; the negotiated terms of an executed or pending lease."
        isLeaseTermMonthToMonth:
          type: "boolean"
          description: "Whether the lease runs month-to-month rather than for a fixed term, indicating an open-ended tenancy."
        leaseDealSourceType:
          allOf:
            - "$ref": "#/components/schemas/LeaseDealSourceType"
          description: "Code indicating the source/origin classification of the lease deal data (where the deal information came from)."
        leaseDealType:
          allOf:
            - "$ref": "#/components/schemas/LeaseDealType"
          description: "Type of lease deal (e.g. new lease, renewal); renewal drives different commencement-date derivation than new/relet deals."
        leaseTerm:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Length of the lease in leaseTermType units; the duration of the lease obligation, used to derive expiration and validate schedules."
        leaseTerminationOptionDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the tenant may exercise an early lease-termination option."
        leaseTerminationOptionPenalty:
          type: "string"
          nullable: true
          description: "Free-text description of the penalty owed for exercising the early-termination option."
        leaseTerminationOptionState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Whether the tenant holds an early-termination (break) option."
        leaseTermType:
          allOf:
            - "$ref": "#/components/schemas/LeaseTermType"
          description: "Unit in which the lease term is expressed (days, months, years); combined with leaseTerm to compute term length in months."
        marketEffectiveRate:
          type: "number"
          nullable: true
          description: "System-calculated market effective rent per SF from the effective-rent engine — base/contract rent net of concessions, TIA and free rent, spread over the term. The modeled market-based effective-rent flavor."
        marketEffectiveRatePerMonth:
          type: "number"
          nullable: true
          description: "System-calculated market effective rent expressed per month, derived from the effective-rent calculation result."
        marketEffectiveRatePerYear:
          type: "number"
          nullable: true
          description: "System-calculated market effective rent expressed per year, derived from the effective-rent calculation result."
        monetaryUnit:
          allOf:
            - "$ref": "#/components/schemas/MonetaryUnit"
          description: "Currency unit for all monetary amounts on the deal; normalize to a common currency before aggregating rents or values across deals."
        netAggregateValue:
          type: "number"
          nullable: true
          description: "Total net value of the lease deal over its term (net of concessions); an aggregate deal-value figure used to size the transaction."
        noLandlordRepresentative:
          type: "boolean"
          description: "Whether the deal explicitly has no landlord/leasing representative; when true, no landlord rep contacts may be supplied."
        noRateEscalation:
          type: "boolean"
          description: "Whether the lease explicitly has no rent escalations; when true, no escalation schedule may be supplied."
        noTenantRepresentative:
          type: "boolean"
          description: "Whether the deal explicitly has no tenant representative; when true, no tenant rep contacts may be supplied."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/Note"
          nullable: true
          description: "Collection of internal research notes/annotations attached to the lease deal record."
        numRenewalOption:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Number of renewal options the tenant holds."
        numRenewalOptionComment:
          type: "string"
          nullable: true
          description: "Free-text comment describing the renewal-option terms."
        percentageRent:
          type: "number"
          nullable: true
          description: "Percentage-rent rate: additional retail rent computed as a percentage of tenant sales above a breakpoint. Displayed as a % on the Lease Comps financial terms."
        percentageRentBreakpoint:
          type: "number"
          nullable: true
          description: "Sales breakpoint above which percentage rent applies; the retail-lease threshold triggering overage rent."
        propertyTaxAmount:
          type: "number"
          nullable: true
          description: "Property-tax amount allocated to the leased space as a tenant occupancy cost, shown on the Lease Comps financial terms ($/SF/Year)."
        propertyTaxAmountPerYear:
          type: "number"
          nullable: true
          description: "Annualized property-tax amount for the leased space; per-year form of the tenant's property-tax occupancy cost."
        proposalEffectiveRate:
          type: "number"
          nullable: true
          description: "System-calculated proposal effective rent per square foot from the effective-rent engine, reflecting the proposal-scenario effective rent."
        proposalEffectiveRatePerMonth:
          type: "number"
          nullable: true
          description: "System-calculated proposal effective rent expressed per month, derived from the effective-rent calculation result."
        proposalEffectiveRatePerYear:
          type: "number"
          nullable: true
          description: "System-calculated proposal effective rent expressed per year, derived from the effective-rent calculation result."
        purchaseOptionComment:
          type: "string"
          nullable: true
          description: "Free-text comment describing the purchase-option terms."
        purchaseOptionDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the tenant may exercise the purchase option."
        purchaseOptionPrice:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Price at which the tenant may buy the property under a purchase option, when the lease has one."
        purchaseOptionState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Whether the tenant holds an option to purchase the property."
        rateActual:
          type: "number"
          nullable: true
          description: "Actual contract rent rate per square foot negotiated in the lease; the contract rent flavor, distinct from asking and effective."
        rateActualIncreaseMethodType:
          allOf:
            - "$ref": "#/components/schemas/RateActualIncreaseMethodType"
          description: "Method by which the actual rate increases over the term (escalation method), describing how contract rent steps up."
        rateActualPerMonth:
          type: "number"
          nullable: true
          description: "Actual contract rent expressed as a total per-month amount; mutually exclusive with per-year and per-SF forms, derived when rate is entered."
        rateActualPerYear:
          type: "number"
          nullable: true
          description: "Actual contract rent expressed as a total per-year amount; mutually exclusive with the per-month and per-SF forms, derived when rate is entered."
        rateAmountType:
          allOf:
            - "$ref": "#/components/schemas/RateAmountType"
          description: "Code indicating how the actual rate is expressed (per square foot, per month, per year, per seat), governing which rateActual* field carries the value."
        rateBasis:
          allOf:
            - "$ref": "#/components/schemas/RateBasis"
          description: "Time basis (monthly/yearly) of the actual rate, needed to normalize the contract rent to a common $/SF/yr basis."
        rateEscalations:
          type: "array"
          items:
            "$ref": "#/components/schemas/LeaseDealRateEscalation"
          nullable: true
          description: "Collection of contractual rent-escalation steps (bump-ups) over the term; each entry can carry the rate after escalation used in effective-rent math."
        renewalOptionDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date by which or on which the renewal option may be exercised."
        renewalOptionState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Whether a renewal option exists on the lease."
        renewalOptionTermInMonths:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Length in months of the lease extension granted by exercising the renewal option."
        rentPlus:
          type: "number"
          nullable: true
          description: "Additional rent-plus amount layered on base rent (e.g. TMI = taxes, maintenance, insurance pass-throughs); a supplemental occupancy charge shown alongside CAM/additional rent on the Lease Comps financial terms."
        reviewDates:
          type: "array"
          items:
            "$ref": "#/components/schemas/LeaseReviewDate"
          nullable: true
          description: "Collection of UK rent-review dates at which the contract rent is reset; paired with reviewPatternYears and reviewDatesState."
        reviewDatesState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "For the UK rent-review-dates collection on the lease."
        reviewPatternYears:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "UK rent-review cadence in years (interval between contractual rent reviews)."
        rightOfFirstOfferComment:
          type: "string"
          nullable: true
          description: "Free-text comment describing the right-of-first-offer terms."
        rightOfFirstOfferState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Whether the tenant holds a right of first offer on additional/adjacent space."
        rightOfFirstRefusalComment:
          type: "string"
          nullable: true
          description: "Free-text comment describing the right-of-first-refusal terms."
        rightOfFirstRefusalSquareFeet:
          type: "number"
          nullable: true
          description: "Square footage covered by the tenant's right of first refusal on additional space."
        rightOfFirstRefusalState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Whether the tenant holds a right of first refusal on additional/adjacent space."
        serviceChargeAmount:
          type: "number"
          nullable: true
          description: "Service-charge amount (UK common-area maintenance / building service charge) payable under the lease — an occupancy cost beyond base rent."
        serviceChargeAmountPerYear:
          type: "number"
          nullable: true
          description: "Annualized service-charge amount for the leased space; per-year form of the building service charge."
        serviceChargeState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "For the service-charge (UK CAM-equivalent) figures, indicating whether a service charge is in place, available, or none."
        serviceType:
          allOf:
            - "$ref": "#/components/schemas/ServiceType"
          description: "Rent service type governing who pays operating expenses — e.g. Triple Net (NNN), Full Service, Modified Gross, Industrial Gross, Single/Double Net; UK FRI/IRI/IRO. Resolved from ref.servicetype; required to compare rents on a like basis."
        signagePayerType:
          allOf:
            - "$ref": "#/components/schemas/SignagePayerType"
          description: "Code identifying who pays for signage under the lease (landlord vs tenant)."
        signageState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Whether the lease grants signage rights to the tenant."
        signDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the lease was signed by both parties; one of the three key lease dates (sign/commencement/move-in)."
        sourceTypes:
          type: "array"
          items:
            "$ref": "#/components/schemas/LeaseDealSourceType"
          nullable: true
          description: "Collection of source-type classifications contributing to the deal record, capturing the multiple origins of the deal data."
        spaceType:
          allOf:
            - "$ref": "#/components/schemas/SpaceType"
          description: "Space provenance of the deal (New, Relet, Sublet); drives expiration-date derivation. In leasing-activity terms Direct = relet + new and Sublet = sublet + assignment; product 'Direct' corresponds to Relet."
        spaceUse:
          allOf:
            - "$ref": "#/components/schemas/SpaceUse"
          description: "Primary use of the leased space (office, retail, industrial, etc.); gates use-specific fields such as Zone A rent for retail."
        spreadOverTermType:
          allOf:
            - "$ref": "#/components/schemas/SpreadOverTermType"
          description: "Code controlling how concessions or rent are spread/amortized over the lease term when computing effective rent."
        tenantImprovementAllowancePerSquareFeet:
          type: "number"
          nullable: true
          description: "Tenant-improvement (TI) allowance per SF the landlord grants for fit-out. A key concession deducted in effective-rent math (NER = base rent less TIA over the term), so a large TIA can push effective rent below base rent."
        zoneARent:
          type: "number"
          nullable: true
          description: "Zone A rent: UK retail rental valuation method pricing the most valuable front-of-shop zone per square foot; only valid when the space use is Retail."
    SpaceOccupiedLoadBay:
      type: "object"
      properties:
        driveInBayState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Indicating the presence/availability status of drive-in bays (grade-level doors) for the occupied industrial/flex space."
        loadingDockState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "Indicating the presence/availability status of loading docks for the occupied industrial space; a core logistics loading attribute."
        numDriveInBays:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Count of drive-in bays (grade-level doors a vehicle drives directly through) serving the occupied space; a key loading-access attribute."
        numExternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Count of exterior loading docks serving the occupied space; a key industrial/distribution logistics attribute."
        numInternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Count of interior loading docks serving the occupied space."
    SpaceOccupied:
      type: "object"
      properties:
        buildOut:
          allOf:
            - "$ref": "#/components/schemas/BuildOut"
          description: "Value describing the build-out type of the occupied space (the nature of the tenant improvements present)."
        buildOutConditionType:
          allOf:
            - "$ref": "#/components/schemas/BuildOutConditionType"
          description: "Condition of the space's build-out/fit-out (e.g. shell, second-generation, fully built), indicating readiness for occupancy."
        buildOutStatus:
          allOf:
            - "$ref": "#/components/schemas/BuildOutStatus"
          description: "Status of the space build-out (e.g. existing, planned, under construction), describing where the fit-out stands."
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of the occupied-space record representing space taken off-market and physically occupied under a lease."
        loadBay:
          allOf:
            - "$ref": "#/components/schemas/SpaceOccupiedLoadBay"
          nullable: true
          description: "Loading-bay attributes of the occupied industrial space (dock/load configuration); a key industrial logistics attribute of the space."
        monthsOnMarket:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of months the space was marketed before being taken off-market and occupied; derived from on-market and off-market dates."
        propertyFloorId:
          type: "integer"
          format: "int32"
          description: "A number uniquely identifying a floor on any property; foreign key locating the occupied space on its floor within the building."
        spaceLayout:
          allOf:
            - "$ref": "#/components/schemas/SpaceLayout"
          description: "Code describing the physical layout/configuration of the occupied space (e.g. open plan, divided offices)."
        spacePosition:
          allOf:
            - "$ref": "#/components/schemas/SpacePosition"
          description: "Retail space position (End Cap, In-line, Outparcel/Pad, Anchor, In-Store) describing where the occupied space sits within a center."
        squareFeetOccupied:
          type: "number"
          nullable: true
          description: "Rentable square footage physically occupied in this space; the area driver for occupancy and net/gross absorption measurement. Restricted and suppressed space-for-lease is excluded from aggregate SF."
        squareFeetOffice:
          type: "number"
          nullable: true
          description: "Office portion of the occupied space in square feet. Relevant to industrial/flex office content."
        squareFeetUsable:
          type: "number"
          nullable: true
          description: "Usable (tenant-exclusive) square footage of the occupied space, excluding shared common area; distinct from rentable area."
        suite:
          type: "string"
          nullable: true
          description: "Suite (or unit) number of the occupied space. NULL when the tenant cannot be identified; otherwise derived from the tenant's address. Its data size should match the corresponding field in SpaceForLease, SpaceOccupied, and CondoUnit."
    CommercialSaleCompApartment:
      type: "object"
      properties:
        apartmentDataSource:
          allOf:
            - "$ref": "#/components/schemas/ApartmentDataSourceType"
          description: "Source of the apartment unit data (e.g. multifamily research vs marketplace feed), indicating provenance."
        avgUnitSizeSqFt:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Average rentable area in square feet for this unit type; size context for rent and price comparisons."
        maxEffectiveRent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Upper bound of effective monthly rent (asking adjusted for concessions) for this unit type; keep the effective flavor separate from asking rent when aggregating."
        maxMonthlyRent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Upper bound of asking monthly rent for this unit type; asking-flavor rent, normalize before aggregating."
        maxOccupants:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Maximum permitted occupants for this unit type."
        minEffectiveRent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Lower bound of effective monthly rent (asking adjusted for concessions) for this unit type; keep the effective flavor distinct from asking rent before comparing."
        minMonthlyRent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Lower bound of asking monthly rent for this unit type; normalize to $/SF/yr and keep the asking flavor distinct before comparing."
        monthlyDiscount:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Monthly rent discount/concession amount applied to this unit type, bridging asking and effective rent."
        numBaths:
          type: "number"
          nullable: true
          description: "Bathroom count for this unit type, fractional to allow half-baths; multifamily unit-mix attribute."
        numBeds:
          type: "integer"
          minimum: 0
          maximum: 255
          description: "Bedroom count of this unit type within the multifamily comp; primary unit-mix attribute."
        numOccupantsVacant:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Vacant occupancy capacity for this unit type (occupant slots unfilled); a multifamily occupancy detail."
        numUnits:
          type: "integer"
          format: "int32"
          description: "Number of units of this type in the property; drives the multifamily unit count and per-unit pricing."
        numUnitsAvailable:
          type: "number"
          nullable: true
          description: "Count of units of this type marketed as available; available is distinct from vacant and includes occupied/future-available units."
        numUnitsVacant:
          type: "number"
          nullable: true
          description: "Count of vacant (physically empty) units of this type at the property; vacancy is physical regardless of lease obligation."
        propertyId:
          type: "integer"
          format: "int32"
          description: "Foreign key to the property the apartment data belongs to; join on integer ID."
        totalConcessionValue:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Total monetary value of concessions offered on this unit type; reduces effective rent below asking."
    Assessment:
      type: "object"
      properties:
        improvedValue:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Assessed value of the buildings and other improvements, excluding land."
        landValue:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Assessed value of the land alone."
        totalValue:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Total assessed value (land plus improvements)."
        improvedRatio:
          type: "number"
          format: "double"
          nullable: true
          description: "Share of the total assessed value attributed to improvements, as a fraction from 0 to 1."
    CommercialSaleCompContact:
      type: "object"
      properties:
        contactFirstName:
          type: "string"
          nullable: true
          description: "First name of the party as captured on the comp; free-text name used when the contact is not resolved to a Contact ID."
        contactId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the person in CoStar contact data."
        contactLastName:
          type: "string"
          nullable: true
          description: "Last name of the party as captured on the comp; free-text name fallback alongside the contact ID."
        contactPhone:
          type: "string"
          nullable: true
          description: "Phone number for the contact party to the sale; personal contact detail captured by research."
        contactRole:
          allOf:
            - "$ref": "#/components/schemas/ContactRole2"
          description: "Role of the person or company on this record, such as listing broker, buyer or seller."
        funds:
          type: "array"
          items:
            type: "integer"
            format: "int32"
          nullable: true
          description: "Collection of investment fund references tied to this party, linking the buyer/seller to the funds behind the transaction. Join on integer IDs."
        locationId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The contact's location - the main work location of the contact."
        locationName:
          type: "string"
          nullable: true
          description: "Name of the company/location for the party as captured on the comp; free-text fallback when not resolved to a Location ID. Join on IDs, not names."
        locationPhone:
          type: "string"
          nullable: true
          description: "Phone number of the company/location party to the sale; contact detail captured by research."
        percentOwned:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Ownership percentage held by this buyer/seller party; summed across parties cannot exceed 100 and is bounded by the partial-interest sale percent."
    CommercialSaleCompEntity:
      type: "object"
      properties:
        allocatedPrice:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Estimated price attributed to this individual asset within a multi-property/portfolio sale when the actual per-property price is unknown; a confidence-flagged modeled value (carry allocatedPriceStatus)."
        allocatedPriceStatus:
          allOf:
            - "$ref": "#/components/schemas/SalePriceStatus"
          description: "How allocatedPrice was established. 8 Allocated means it is an estimated share of the portfolio price; the other values have the meanings given for salePriceStatus."
        assetType:
          allOf:
            - "$ref": "#/components/schemas/AssetType"
          description: "Type of the asset/entity in the sale (e.g. property, document); determines the grain and which fields apply. Filter on this before counting true comps."
        averageRentalRate:
          type: "number"
          nullable: true
          description: "Average rental rate for the asset at sale; income input for investment-sale valuation. Normalize flavor/type before comparing."
        buildingFullName:
          type: "string"
          nullable: true
          description: "Full name of the building/asset; hospitality-specific identifier used for hotel comps."
        capitalizationRateActual:
          type: "number"
          nullable: true
          description: "Actual (in-place NOI) cap rate for this individual asset (R = NOI / Value); core per-asset valuation metric. In UK/France this field carries Yield (inclusive of acquisition costs) rather than Cap Rate."
        capitalizationRateProForma:
          type: "number"
          nullable: true
          description: "Pro forma (projected-NOI) cap rate for this individual asset; flag as a projection when reported."
        documentId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Foreign key to the transfer document associated with this entity, linking the asset to its recorded deed."
        entityId:
          type: "integer"
          format: "int32"
          description: "Id of the sold asset this entry describes; read it with assetType (a property, a condo unit or a rumored property)."
        hotelClass:
          allOf:
            - "$ref": "#/components/schemas/HotelClass"
          description: "Hotel class/tier of the asset (hospitality-specific); a benchmarking attribute for hotel sale comps, aligned to STR-style hospitality classification used in hospitality KPI calculations."
        hotelOperationType:
          allOf:
            - "$ref": "#/components/schemas/HotelOperationType"
          description: "Hotel operating arrangement (e.g. franchise, managed, independent); hospitality-specific attribute affecting value."
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of this per-asset comp-entity row within the sale comp."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/Note"
          nullable: true
          description: "Collection of free-text research notes attached to this comp-entity, often capturing per-asset deal context."
        numberOfUnits:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Unit count for the asset; multifamily/land attribute supporting price-per-unit metrics."
        percentLeased:
          type: "number"
          nullable: true
          description: "Share of the asset under lease at the time of sale; the occupancy/leasing profile is a key comp comparability dimension for income durability (leased differs from physically occupied)."
        propertyId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "PropertyID added to enable searches by property/address without joining to Property or CondoUnit+Property by sale entity type, dramatically improving comp retrieval speed."
        totalSquarefeet:
          type: "number"
          nullable: true
          description: "Total square footage of the asset; size denominator for price/SF and multifamily/land sizing."
    MarketAssessment:
      type: "object"
      properties:
        marketImprovementValue:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Assessor's market value of the buildings and other improvements."
        marketLandValue:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Assessor's market value of the land."
        marketTotalValue:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Assessor's total market value (land plus improvements)."
        marketImprovementPercent:
          type: "number"
          nullable: true
          description: "Share of the assessor's total market value attributed to improvements."
    TransferDocumentAssessment:
      type: "object"
      properties:
        assessment:
          allOf:
            - "$ref": "#/components/schemas/Assessment"
          nullable: true
