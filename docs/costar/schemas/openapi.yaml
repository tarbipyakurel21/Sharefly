          type: "integer"
          format: "int32"
          description: "Unique identifier of the transfer (deed) document record underlying the sale comp."
        isNonDisclosure:
          type: "boolean"
          description: "Whether the sale falls in a non-disclosure jurisdiction where price is not publicly recorded, explaining undisclosed/estimated prices."
