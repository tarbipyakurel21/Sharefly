openapi: "3.0.3"
info:
  title: "CoStar Hackathon Data Models"
  version: "1.0.0"
  description: "Record shapes for the CoStar Princeton hackathon data files. Each data file holds one record as JSON; enum fields are stored as integer codes."
paths: {}
components:
  schemas:
    CommercialProperty:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of the commercial property; the asset is the anchor of all CRE data, and this is the join key for everything attached to it. Also the translation key."
        addresses:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyAddress"
          description: "Collection of address-record identifiers associated with the property (multi-address sites); join on integer IDs to resolve geography."
        primaryAddress:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyAddress"
          nullable: true
          description: "Identifier of the property's primary address record; join on the integer ID to resolve geography. The address whose id is the property's primary address id; null when the property has none."
        propertyType:
          allOf:
            - "$ref": "#/components/schemas/PropertyType"
          description: "Primary CRE asset class (Office, Industrial, Flex, Retail, Multifamily, Hospitality, Land, etc.); drives the type-specific attribute set and the analytic property-type slices used for vacancy/rent/absorption aggregation."
        propertySubtype:
          allOf:
            - "$ref": "#/components/schemas/PropertySubtype"
          description: "Finer classification of the property within its propertyType, refining the asset's specific use category."
        isCondo:
          type: "boolean"
          nullable: true
          description: "Whether the property is held under condominium ownership rather than a single fee-simple title."
        buildingClass:
          allOf:
            - "$ref": "#/components/schemas/BuildingClass"
          description: "Building Class A/B/C — a market-relative, subjective quality grade (A above-average, B average, C below-average); not comparable across markets and distinct from the CoStar Building Rating. Required and validated against Rating via the Class<->Rating matrix."
        buildingRating:
          allOf:
            - "$ref": "#/components/schemas/BuildingRating"
          description: "CoStar Building Rating (formerly Star Rating), a 1-5 national peer-property-type quality grade (5 best-in-class, 1 well-below-average); comparable across markets and distinct from Building Class. Validated against Class via the Class<->Rating matrix."
        buildingRatingType:
          allOf:
            - "$ref": "#/components/schemas/BuildingRatingType"
          description: "Code indicating the rating scheme/basis behind buildingRating (e.g. which star-rating system applies)."
        propertyGroupId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Unique identifier for the property-group record (a collection of related properties such as a campus or shopping center). Id of the first property group that contains this property; null when it is in none."
        constructionStatus:
          allOf:
            - "$ref": "#/components/schemas/ConstructionStatus"
          description: "Lifecycle status of the building (Proposed, Under Construction, Under Renovation, Existing, Abandoned, Demolished); non-existing statuses are excluded from existing inventory, vacancy, and absorption until actual delivery/move-in."
        coStarBuildingType:
          allOf:
            - "$ref": "#/components/schemas/CoStarBuildingType"
          description: "CoStar internal building-type classification of the property."
        buildingName:
          type: "string"
          nullable: true
          description: "Proper name of the building used in marketing and identification."
        buildingPark:
          type: "string"
          nullable: true
          description: "Display name of the property group (e.g. center or campus name); translatable. Name of the property's group when it has one, otherwise the property's own building park value."
        propertyWebsiteUrl:
          type: "string"
          nullable: true
          description: "External marketing website URL for the property."
        grossBuildingAreaSquareFeet:
          type: "number"
          nullable: true
          description: "Gross Building Area (GBA): the whole building measured to the outside of exterior walls, including shafts (elevators/stairs) and common areas. Basis for construction/zoning/tax and the FAR numerator (FAR = GBA / Lot Size); distinct from RBA. Square-foot value of the source measurement."
        grossTypicalFloorSquareFeet:
          type: "number"
          nullable: true
          description: "Size of the building's most common floor; a representative per-floor metric, not a sum of all floor areas. Square-foot value of the source measurement."
        rentableBuildingAreaSquareFeet:
          type: "number"
          nullable: true
          description: "Rentable Building Area (RBA): area inside the walls excluding vertical shafts but including common areas — the leasing/revenue/investing basis and the vacancy denominator. RBA used for all uses except retail (which uses GLA); must be <= GBA. Square-foot value of the source measurement."
        numStoriesAboveGrade:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of building stories above ground level; an office/high-rise vertical-scale attribute."
        constructionEvents:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyConstructionEvent"
          description: "Collection of construction milestone events for the property (e.g. built, renovated), capturing its development lifecycle."
        buildingHeightInFeet:
          type: "number"
          nullable: true
          description: "Overall height of the building in feet."
        buildingConstructionMaterial:
          allOf:
            - "$ref": "#/components/schemas/BuildingConstructionMaterialType"
          description: "Primary construction material / structural system of the building (e.g. steel, reinforced concrete, masonry, wood frame); describes the predominant structural system, populated from broker/marketing material."
        sprinklerType:
          allOf:
            - "$ref": "#/components/schemas/SprinklerType"
          description: "Type of fire sprinkler system installed (e.g. wet, dry, ESFR); ESFR sprinklers matter for industrial/warehouse use."
        hasSprinklers:
          type: "boolean"
          nullable: true
          description: "For the presence/availability of a fire sprinkler system; a key industrial/life-safety attribute. True if the sprinkler state is Yes, false if No, otherwise null."
        lotLengthInFeet:
          type: "number"
          nullable: true
          description: "Length/depth of the land parcel in feet; a land/site dimension attribute."
        lotWidthInFeet:
          type: "number"
          nullable: true
          description: "Width of the land parcel the property sits on, in feet; a land/site dimension attribute."
        lotSize:
          type: "number"
          nullable: true
          description: "Total size of the land parcel as a unit-bearing measurement (e.g. acres or square feet); a core land/site attribute. Kept in acres when the source unit is acres; otherwise expressed in square feet (square meters multiplied by 10.7639 and rounded to a whole number); null when no lot size exists."
        lotSizeMeasurementType:
          allOf:
            - "$ref": "#/components/schemas/MeasurementUnit"
          description: "Total size of the land parcel as a unit-bearing measurement (e.g. acres or square feet); a core land/site attribute. Unit of lot size after conversion: Acres stays Acres, SquareMeters becomes squareFeet, other units are kept, and Unknown when no lot size exists."
        zoningDescription:
          type: "string"
          nullable: true
          description: "Short zoning code/classification governing permitted use of the property; a core land/use attribute."
        zoningLongDescription:
          type: "string"
          nullable: true
          description: "Extended free-text description of the property's zoning and permitted uses; translatable."
        parcelNumbers:
          type: "array"
          items:
            type: "string"
          description: "Collection of county assessor parcel references (APNs scoped by county) tying the property to public tax/ownership records. List of the parcel number values from the property's parcel references."
        parcelReferences:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyParcelReference"
          description: "Collection of county assessor parcel references (APNs scoped by county) tying the property to public tax/ownership records. Parcel number and county pairs copied from the property's parcel numbers."
        parking:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyParking"
          description: "Collection of parking detail records for the property describing spaces, types, and configuration."
        parkingRatio:
          type: "number"
          nullable: true
          description: "Parking spaces per 1,000 SF of RBA/GLA; use the ratio rather than raw counts to compare parking provision across differently sized properties."
        primarySubmarketId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the property's primary CoStar submarket (a building-type-specific competitive area, not admin geography); join on the integer ID."
        primaryPhoto:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyAttachmentReference"
          nullable: true
          description: "Collection of media attachment references (photos, floor plans, documents) for the property used on marketing surfaces. The property's attachment of type primaryPhoto, or the first published attachment when there is no primary photo; null when neither exists."
        attachments:
          type: "array"
          items:
            "$ref": "#/components/schemas/PropertyAttachment"
          description: "Collection of media attachment references (photos, floor plans, documents) for the property used on marketing surfaces. The property's published attachments: photos, floor plans, aerials, plat maps, site plans and Matterport 3D scans. Each Matterport videoKey is a MatterportModelId in commercial-properties.csv."
        amenities:
          type: "array"
          items:
            type: "integer"
            format: "int32"
          description: "Collection of amenity catalog identifiers attached to the property describing its features; amenities are a key marketing/quality attribute. List of amenity ids from the property record."
        renovations:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyRenovation"
          description: "Collection of renovation records for the property, capturing improvement history relevant to condition and lifecycle."
        aliases:
          type: "array"
          items:
            type: "string"
          description: "Collection of alternative names/aliases the property is known by, supporting search and matching."
        propertyOffice:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyOffice"
          nullable: true
          description: "Only set when propertyType is Office; otherwise null. Filled even if the property has no office record, in which case its values are null."
        propertyRetail:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyRetail"
          nullable: true
          description: "Only set when propertyType is GeneralRetail; otherwise null. Filled even if the property has no retail record, in which case most values are null."
        propertyIndustrial:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyIndustrial"
          nullable: true
          description: "Only set when propertyType is Industrial; otherwise null."
        propertyFlex:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyFlex"
          nullable: true
          description: "Only set when propertyType is Flex; otherwise null."
        propertyHospitality:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyHospitality"
          nullable: true
          description: "Only set when propertyType is Hospitality and a hotel record exists; otherwise null."
        propertyApartment:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyApartment"
          nullable: true
          description: "Only set when propertyType is Multifamily; otherwise null."
        propertySportsAndEntertainment:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertySportsAndEntertainment"
          nullable: true
          description: "Only set when propertyType is SportsAndEntertainment; otherwise null. Has no subtype source record, only the base property."
        propertyResidence:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyResidence"
          nullable: true
          description: "Only set when propertyType is Residential or Homes and a residence record exists; otherwise null."
        propertyGroupSubtype:
          allOf:
            - "$ref": "#/components/schemas/PropertyGroupSubtype"
          description: "Finer subtype of the group, valid only for its parent PropertyGroupType. For shopping centers this aligns with the controlled Shopping Center Type taxonomy (Neighborhood/Community/Power/Lifestyle/Strip Center, Regional/Super Regional Mall, Outlet Center, etc.). Subtype of the first property group that contains this property; Unknown when it is in none."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyNotes"
          description: "Collection of internal notes/annotations attached to the property record; translatable, may hold research commentary."
        land:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyLand"
          nullable: true
          description: "Only set when propertyType is Land and a land record exists; otherwise null."
        contacts:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyContact"
          description: "Contacts linked to the property, keeping only contacts with no end date (current contacts)."
        environmental:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyEnvironmental"
          nullable: true
          description: "Environmental record for the property; not fetched for Land properties, so null for them."
        floors:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyPropertyFloor"
          description: "Floors of the building, one entry per floor, with no filter for removed floors."
        propertyPropertyResidence:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyPropertyResidence"
          nullable: true
          description: "Only set when propertyType is Residential or Homes and a residence record exists; otherwise null. Identical duplicate of propertyResidence kept for downstream consumers that have not yet switched."
    CommercialListingSummary:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of the commercial marketing listing record; the primary key tying together the listing's lease/sale terms, attachments, and entities."
        listingType:
          allOf:
            - "$ref": "#/components/schemas/ListingType"
          description: "Code listing type that fixes the marketing arrangement: a Sale variant (Property/Land/Portfolio/Consolidated-Condo For Sale, IDs 9/12/13/15), a Direct/Sublet/Coworking Lease variant (IDs 14/16/17/18/19/20/21), an Auction variant (IDs 22-26), or Disconnected (27/28). Constrains allowed statuses and concurrency rules."
        listingStatus:
          allOf:
            - "$ref": "#/components/schemas/ListingStatus"
          description: "Lifecycle status of the listing (Draft, Active, Pending, OffMarket, Terminate, Confidential, etc.) governing publication and transition rules; private statuses (Introduction/Confidential) are restricted to private for-sale/portfolio types."
        listingStatusUpdatedDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Timestamp of the last status change on the listing, set automatically when status transitions; tracks market-state recency."
        createdDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the listing record was created."
        brokerageCompanyName:
          type: "string"
          nullable: true
          description: "Firm name used at this location. Should always be populated, even when identical to the company name. Null when none."
        certifiedFreshDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the listing was last certified fresh/accurate; supports the periodic re-check cycle so consumers know how current it is."
        commissionValue:
          type: "number"
          nullable: true
          description: "Brokerage commission offered on the deal; internal compensation/economics of the listing not part of the marketed price."
        commissionSplitPercent:
          type: "number"
          nullable: true
          description: "Percentage of the commission shared with a cooperating broker (e.g. the buyer/tenant-rep side); internal compensation term."
        transactionValue:
          type: "number"
          nullable: true
          description: "Monetary value of the underlying transaction; an internal financial figure, qualify confidence/flavor when comparing to comps."
        listingExpirationInMonths:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Date the listing/marketing agreement with the broker expires, bounding how long the property may be actively marketed under this mandate. Whole months from the day the record is built to the month the listing agreement expires, so it changes over time and is negative once expired; null when no expiration date is recorded."
        propertyId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the single subject property the listing markets; the property is the anchor of all CRE data."
        propertyGroupId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the property group/portfolio when the listing markets multiple properties as a set rather than a single asset. For lease listings only: the property group id from the listing summary, or 0 when there is none. Null for every other listing type."
        propertyType:
          allOf:
            - "$ref": "#/components/schemas/PropertyType"
          description: "Primary CRE property-type classification of the subject (Office, Industrial, Retail, Multifamily, etc.); see the commercial listing data structure for the propertyType/SubType ID taxonomy. Drives the relevant attribute set and filtering."
        buildingName:
          type: "string"
          nullable: true
          description: "Marketing name of the building the listed space sits in, shown in listing displays."
        buildingSizeSquareFeet:
          type: "number"
          nullable: true
          description: "Total size of the building in square feet (RBA/GBA scale) — RBA is rentable area; GBA is the whole-building gross measure before deducting vertical penetration. Gives the whole-asset footprint behind the listed space."
        buildingClass:
          allOf:
            - "$ref": "#/components/schemas/BuildingClass"
          description: "Building Class A/B/C — a market-relative, subjective quality grade (A above-average, B average, C below-average); not comparable across markets and distinct from the CoStar Building Rating. Required and validated against Rating via the Class<->Rating matrix."
        buildingConditionRating:
          allOf:
            - "$ref": "#/components/schemas/BuildingConditionRating"
          description: "Code rating of the building's physical condition/quality."
        buildingPark:
          type: "string"
          nullable: true
          description: "Name of the business park or development the building belongs to."
        buildingRating:
          allOf:
            - "$ref": "#/components/schemas/BuildingRating"
          description: "CoStar Building Rating (formerly Star Rating), a 1-5 national peer-property-type quality grade (5 best-in-class, 1 well-below-average); comparable across markets and distinct from Building Class. Validated against Class via the Class<->Rating matrix."
        constructionCompleteYear:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Collection of construction milestone events for the property (e.g. built, renovated), capturing its development lifecycle. Year of the first construction event of type ConstructionComplete on the property; null when there is none."
        renovationCompleteYear:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Collection of construction milestone events for the property (e.g. built, renovated), capturing its development lifecycle. Year of the first construction event of type RenovationFinished on the property; null when there is none."
        coStarBuildingType:
          allOf:
            - "$ref": "#/components/schemas/CoStarBuildingType"
          description: "CoStar internal building-type classification of the property."
        primarySubmarketId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the CoStar submarket the property falls in; submarkets are building-type-specific competitive areas, not admin geography. Join on the ID."
        primarySubmarketName:
          type: "string"
          nullable: true
          description: "Not populated in this dataset; expect null."
        address:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryAddress"
          nullable: true
          description: "Foreign key to the address record for the listed property/space; join on the integer ID. The address record whose id is stored on the listing summary; null when there is none. It is the full address, with no part hidden."
        listingFeedStatusUpdatedDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Timestamp the listing's feed status last changed, indicating freshness of the syndication state."
        isFeedConsolidated:
          type: "boolean"
          nullable: true
          description: "Only for feed listings: true when more than one third-party listing shares the feed instance id (found through the listing's BureauxLocaux or Realla external reference), false when exactly one; null for non-feed listings."
        sourceDocumentCount:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Only for feed listings: the number of third-party listings sharing the feed instance id; null for non-feed listings."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryCommercialListingNotes"
          nullable: true
          description: "Collection of internal notes attached to the commercial listing record, holding research or annotation commentary. The listing's own notes, each mapped to a header, type and text."
        auctionForSaleSummary:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryAuctionForSaleSummary"
          nullable: true
          description: "Identifier of the auction for-sale offering record tied to this listing on the auction platform. Only present for auction listing types (property, land, condo, loan or portfolio for auction); null for every other listing type."
        attachments:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryAttachmentReference"
          description: "Collection of media attachment references (photos, brochures, floor plans) marketed with the commercial listing. Listing-level media that qualify as listing attachments. When the listing has none, the primary media of its property is used instead (not for portfolio, shopping-center or building-park listings, which fall back to their properties or property group)."
        listingContacts:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryContact"
          description: "Collection of contact references (agents, owners, managers) tied to the listing; drives claimed-listing edit permissions and displayed contact info. Every contact reference on the listing, each filled in from the Contact and Location models."
        forLeaseSummary:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryForLease"
          nullable: true
          description: "Only present for for-lease listing types (direct space, sublease, lease assignment, coworking, land lease, shopping-center, building-park or disconnected space lease) and when a listing summary record exists; null otherwise."
        forSaleSummary:
          allOf:
            - "$ref": "#/components/schemas/CommercialListingSummaryForSale"
          nullable: true
          description: "Only present for for-sale listing types (property, land, condo, consolidated condo, portfolio, residential property, disconnected sale or disconnected condo for sale); null for every other listing type."
        propertyContacts:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialListingSummaryPropertyContact"
          description: "The property's contact records that have no end date, each filled in from the Contact and Location models."
        monetaryUnit:
          allOf:
            - "$ref": "#/components/schemas/MonetaryUnit"
          nullable: true
          description: "Currency of the listing's monetary figures (prices, rents, NOI); normalize currency before aggregating money across listings."
    LocationOccupancy:
      type: "object"
      properties:
        addressId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Foreign key to the specific address/suite the tenant occupies within the property, for multi-address properties."
        expirationReason:
          allOf:
            - "$ref": "#/components/schemas/LocationOccupancyExpirationReason"
          description: "Reason the occupancy ended (e.g. lease expiration, relocation), explaining tenant move-out and informing rollover analysis."
        fromDate:
          type: "string"
          format: "date-time"
          description: "Start date of the occupancy period; when the tenant's occupancy of the space begins, used for tenancy timelines and absorption."
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of the tenant-occupancy record, representing one company's occupancy of space in a property over a date range."
        industryType:
          allOf:
            - "$ref": "#/components/schemas/IndustryType"
          description: "Industry/business classification of the occupying tenant; for unknown tenants it captures the business type when the company is not yet identified."
        leaseDeal:
          allOf:
            - "$ref": "#/components/schemas/LeaseDeal"
          nullable: true
          description: "The associated lease-deal record carrying the negotiated lease terms (rent, dates, escalations, concessions) for this occupancy when a lease comp exists."
        leaseType:
          allOf:
            - "$ref": "#/components/schemas/LeaseType"
          description: "Lease arrangement governing the occupancy (direct lease, sublease, owner-occupied). For leasing-activity rollups Direct = relet + new space and Sublet = sublet + assignment space; owner leases of their own buildings are excluded."
        moveInDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the tenant physically moved into the space (occupancy event). Drives net/gross absorption — absorption is counted from move-in events on occupied space, not the lease sign date."
        propertyId:
          type: "integer"
          format: "int32"
          description: "Foreign key to the property in which the tenant occupies space; anchors the occupancy to the building."
        spaces:
          type: "array"
          items:
            "$ref": "#/components/schemas/SpaceOccupied"
          nullable: true
          description: "Collection of occupied-space records detailing the specific spaces/suites and square footage the tenant occupies within the property."
        tenantLocationId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Foreign key to the Location (company node) that is the tenant occupying the space; null for an unknown/unidentified tenant."
        toDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "End date of the occupancy period; null while the tenant is still in place. Distinguishes current versus historical occupancies and rollover timing."
    CommercialSaleComp:
      type: "object"
      properties:
        apartments:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialSaleCompApartment"
          nullable: true
          description: "Collection of multifamily unit-mix/rent rows attached to the comp, supporting per-unit pricing metrics for apartment sales."
        askingPriceHigh:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Upper end of the sale price range requested by the seller; most pertinent to portfolio sales."
        askingPriceLow:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Lower end of the sale price range requested by the seller; most pertinent to portfolio sales."
        assessment:
          allOf:
            - "$ref": "#/components/schemas/Assessment"
          nullable: true
          description: "Assessed value (improved/land/total) from the tax authority for the comp, typically aggregated across transfer documents; supports valuation context."
        auctionForSaleIds:
          type: "array"
          items:
            type: "integer"
            format: "int32"
          nullable: true
          description: "Identifiers of auction for-sale listings associated with this comp, linking the sale to auction-sourced listings (e.g. Ten-X). Join on integer IDs."
        belowMarketSaleReasons:
          type: "array"
          items:
            "$ref": "#/components/schemas/BelowMarketSaleReason"
          nullable: true
          description: "Reasons the sale priced below market (e.g. correction deed, refinance, trust deed, related-party). These disqualify the comp from contact sync and affect comparability — exclude/flag accordingly."
        buildingParkType:
          allOf:
            - "$ref": "#/components/schemas/BuildingParkType"
          description: "Type of building park for a portfolio sale; values include Business Park, Office Park, and Industrial Park."
        capitalizationRateActual:
          type: "number"
          nullable: true
          description: "Cap rate from actual in-place NOI over price (R = NOI / Value); lower cap = lower risk/higher price. In US/Canada CoStar captures Cap Rate; in the UK/France the same field carries Yield, which is inclusive of acquisition costs."
        capitalizationRateProForma:
          type: "number"
          nullable: true
          description: "Cap rate based on projected/pro-forma NOI rather than actual in-place income (R = NOI / Value); flag as a projection when reported. In UK/France this field carries Yield rather than Cap Rate."
        contacts:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialSaleCompContact"
          nullable: true
          description: "Parties tied to the comp (buyers, sellers, brokers, preparers) with their roles; True vs Recorded distinguishes real parties from deed-name parties. Contacts sync only for a valid comp with a qualifying Buyer/Seller and no disqualifying below-market reason."
        dateOffMarket:
          type: "string"
          format: "date-time"
          nullable: true
          description: "The date the for-sale item (Property, Land, or CondoUnit) was taken off the market, via sale or owner withdrawal."
        dateOnMarket:
          type: "string"
          format: "date-time"
          nullable: true
          description: "The date the for-sale item (Property, Land, or CondoUnit) went on the market."
        downPayment:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Amount of money presented up front in a completed sale."
        entities:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialSaleCompEntity"
          nullable: true
          description: "Per-property/asset breakdown of what sold in the transaction; each entity carries allocated price and property-type-specific attributes. Filter to true-comp grain before aggregating."
        escrowLengthInDays:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of days elapsing between the date the property goes under contract (in escrow) and the date it settles (close of escrow)."
        forSaleIds:
          type: "array"
          items:
            type: "integer"
            format: "int32"
          nullable: true
          description: "Identifiers of the for-sale listing records associated with this comp, linking the completed sale back to its marketing listings. Join on integer IDs."
        grossIncomeMultiplier:
          type: "number"
          nullable: true
          description: "(GIM) Ratio of sale price to gross scheduled income plus other income at sale (or projected first-year GSI); a price-to-income valuation multiplier."
        grossRentMultiplier:
          type: "number"
          nullable: true
          description: "(GRM) Multifamily valuation statistic: sale price relative to the property's gross monthly rent, used to gauge a reasonable price against the income generated."
        id:
          type: "integer"
          format: "int32"
          description: "Unique identifier of the sale comp record; the join/anchor key for a completed sale used as a comparable transaction."
        isLandValueSale:
          type: "boolean"
          description: "Flag indicating the property(ies) sold for the value of the land."
        isNoBuyerBroker:
          type: "boolean"
          description: "Explicitly indicates that no buyer broker was involved with the sale."
        isNoListingBroker:
          type: "boolean"
          description: "Explicitly indicates that no listing broker was involved with the sale."
        marketAssessment:
          allOf:
            - "$ref": "#/components/schemas/MarketAssessment"
          nullable: true
          description: "Market (full-value) assessment figures (improvement/land/total) from the assessor, distinct from assessed value; valuation context for the comp."
        monetaryUnit:
          allOf:
            - "$ref": "#/components/schemas/MonetaryUnit"
          description: "Currency/monetary unit of the comp amounts."
        notes:
          type: "array"
          items:
            "$ref": "#/components/schemas/Note"
          nullable: true
          description: "Collection of free-text research notes attached to the comp, often capturing the deal story/motivation behind the sale."
        numberOfEntities:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Count of properties/assets (entities) included in the sale transaction; >1 indicates a multi-property or portfolio sale where prices may be allocated."
        partialInterestSalePercent:
          type: "number"
          nullable: true
          description: "For a partial-interest sale, the percentage of the property that was sold; does not apply to all sales."
        portfolioName:
          type: "string"
          nullable: true
          description: "For a portfolio sale, the name of the portfolio."
        portfolioType:
          allOf:
            - "$ref": "#/components/schemas/PortfolioType"
          description: "Code classifying whether/how this sale is part of a multi-property portfolio transaction."
        pricePerRoom:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Sale price per room; applies only to hotel/hospitality properties."
        pricePerUnit:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Sale price per unit; applicable only to multi-family property and residential land."
        proposedLandUse:
          allOf:
            - "$ref": "#/components/schemas/ProposedLandUse"
          description: "Intended/best use of the land for a land-value sale (e.g. zoning/development intent); only meaningful when isLandValueSale is true."
        saleConditions:
          type: "array"
          items:
            "$ref": "#/components/schemas/SaleCondition"
          nullable: true
          description: "Collection of conditions affecting the sale price/comparability (distressed, lease-up, business-value-included, etc.); surface when comparing comps."
        saleFinancingType:
          allOf:
            - "$ref": "#/components/schemas/SaleFinancingType"
          description: "Indicates whether or not the sale involved financing."
        saleMethod:
          allOf:
            - "$ref": "#/components/schemas/SaleMethod"
          description: "Method by which the sale was transacted (e.g. standard sale, auction); defaults to standard sale."
        salePriceStatus:
          allOf:
            - "$ref": "#/components/schemas/SalePriceStatus"
          description: "How the sale price was established: 3 Confirmed by a party to the sale; 5 FullValue, calculated from the transfer tax and not confirmed; 7 Unconfirmed, a regional form of FullValue; 2 Approximate, reported by the buyer or in a news article; 1 Affidavit or 4 Declaration, taken from the document recorded with the deed; 6 Mini, only one of price and size is public; 0 Unknown when no status is recorded. Carry it with soldForPrice."
        saleType:
          allOf:
            - "$ref": "#/components/schemas/SaleType"
          description: "Nature of the sale (e.g. Investment vs Owner/User). A core comparability dimension: investment sales (bought for income) vs owner/user sales surface different relevant fields and should be screened together when comparing comps."
        soldDate:
          type: "string"
          format: "date-time"
          description: "The date the property sold under the current sale; technically, the date the most recent deed on the property was recorded."
        soldForPrice:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Price for which the Property, Land, or CondoUnit sold. Disclosure/trust level varies (full amount stated on document, computed from transfer/excise tax, or non-disclosure), so always carry salePriceStatus."
        source:
          allOf:
            - "$ref": "#/components/schemas/CompSourceType"
          description: "Source of the comp transaction."
        tenure:
          allOf:
            - "$ref": "#/components/schemas/Tenure"
          description: "Tenure of the sale."
        transferDocuments:
          type: "array"
          items:
            "$ref": "#/components/schemas/TransferDocument"
          nullable: true
          description: "Collection of recorded transfer/deed documents underlying the sale, carrying recording details, taxes, and assessments."
        verificationFields:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialSaleCompVerificationField"
          nullable: true
          description: "Collection of per-field verification records indicating which comp fields were verified, by whom, and from which source."
        verificationSources:
          type: "array"
          items:
            "$ref": "#/components/schemas/VerificationSource"
          nullable: true
          description: "Collection of sources used to verify the comp (e.g. broker, public record); supports field-level verification provenance."
    ResidentialListingDetail:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Id of the MLS (multiple listing service) listing; each record in this file is one MLS listing."
        residentialListingId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of one attempt to sell or rent one home, shared by every MLS listing of that home and attempt. Several records can have the same value."
        propertyId:
          type: "integer"
          format: "int64"
          description: "Id of the home itself: a house, or one condo or apartment unit."
        transactionType:
          allOf:
            - "$ref": "#/components/schemas/TransactionType"
          nullable: true
          description: "Whether the listing is for sale or for rent. Filter on this before comparing prices, because rentals carry monthly rent."
        listingStatus:
          allOf:
            - "$ref": "#/components/schemas/ListingStatus2"
          nullable: true
          description: "MLS status of the listing: active, contract (under contract), sold (which also covers a leased rental), inactive or removed."
        forSaleStatus:
          allOf:
            - "$ref": "#/components/schemas/ForSaleStatus"
          nullable: true
          description: "Homes.com for-sale status of the listing, such as for sale, under contract, sold or recently off market. Null on rentals."
        forRentStatus:
          allOf:
            - "$ref": "#/components/schemas/ForRentStatus"
          nullable: true
          description: "Homes.com for-rent status of the listing, such as for rent or rented. Filled only on rentals."
        listDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the listing was put on the market, as an ISO 8601 date-time."
        offMarketDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the listing went off the market, as an ISO 8601 date-time."
        contractDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the home went under contract, as an ISO 8601 date-time."
        closeDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Closing date of the sale, or the lease date for a rental, as an ISO 8601 date-time. Filled mainly on sold listings."
        availabilityDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date a rental or new home becomes available, as an ISO 8601 date-time. Filled on few listings."
        certifiedDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date a new-home listing was last certified or updated by the builder, as an ISO 8601 date-time. Filled on few listings."
        closePrice:
          type: "number"
          nullable: true
          description: "Final price at closing in US dollars: the sale price for a sale, or the agreed monthly rent for a rental. Null on Texas sold or recently-off-market for-sale listings, because Texas does not disclose sale prices."
        currentPrice:
          type: "number"
          nullable: true
          description: "Current asking price in US dollars: the list price for a sale or the monthly rent for a rental. On a sold listing it is the last asking price before the sale. Null on Texas sold or recently-off-market for-sale listings, because Texas does not disclose sale prices."
        listPriceMax:
          type: "number"
          nullable: true
          description: "Highest list price in US dollars across a new-home floor plan's listings. Filled on few listings."
        listPriceMin:
          type: "number"
          nullable: true
          description: "Lowest list price in US dollars across a new-home floor plan's listings. Filled on few listings."
        rentMax:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Highest monthly rent in US dollars for the rental listing. Filled on rentals only."
        rentMin:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Lowest monthly rent in US dollars for the rental listing. Filled on rentals only."
        listingType:
          allOf:
            - "$ref": "#/components/schemas/ListingType2"
          nullable: true
          description: "Kind of sale, such as resale, new home, short sale or foreclosure. Bit flags: a value can combine several codes."
        dom:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Days on market: the number of days the listing has been on the market."
        domDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date on which `dom` was last counted, as an ISO 8601 date-time."
        virtualDateOnMarket:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date on market adjusted to account for time the home spent off the market, as an ISO 8601 date-time."
        monetaryUnit:
          allOf:
            - "$ref": "#/components/schemas/MonetaryUnit"
          nullable: true
          description: "Currency of the prices on the listing; every listing in this kit uses US dollars."
        originalPrice:
          type: "number"
          nullable: true
          description: "Asking price when the listing was first put on the market, in US dollars (monthly rent for a rental). Null on Texas sold or recently-off-market for-sale listings, because Texas does not disclose sale prices."
        removedDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the listing was removed from Homes.com, as an ISO 8601 date-time. Filled on few listings."
        remarks:
          type: "string"
          nullable: true
          description: "The agent's public marketing description of the home, as free text."
        sourceNumber:
          type: "string"
          nullable: true
          description: "The MLS number of the listing, the number agents use to find it in their MLS."
        altSourceNumber:
          type: "string"
          nullable: true
          description: "A second MLS number for the listing, when the MLS uses one. Filled on few listings."
        specialFeatures:
          allOf:
            - "$ref": "#/components/schemas/ListingSpecialFeatures"
          nullable: true
          description: "Marketing flags on the listing, such as new home, price reduction or virtual tour. Bit flags: a value can combine several codes."
        resoValues:
          allOf:
            - "$ref": "#/components/schemas/ListingResoValues"
          nullable: true
          description: "Standardized listing features (RESO, the real estate data standard) such as heating, cooling, pool, HOA fees and parking."
        property:
          allOf:
            - "$ref": "#/components/schemas/Property"
          nullable: true
          description: "The home the listing is for: its address, type, size, beds and baths, and the other listings of the same home."
        media:
          type: "array"
          items:
            "$ref": "#/components/schemas/Media"
          nullable: true
          description: "Photos, 3D tours, videos and floor plans of the listing."
        agents:
          type: "array"
          items:
            "$ref": "#/components/schemas/MlsAgent"
          nullable: true
          description: "The agents on the listing, such as the listing agent, with their contact and brokerage details."
        openHouses:
          type: "array"
          items:
            "$ref": "#/components/schemas/ListingOpenHouse"
          nullable: true
          description: "Open houses scheduled for the listing. Filled on few listings."
        permissionLevels:
          allOf:
            - "$ref": "#/components/schemas/ListingPermissionLevels"
          nullable: true
          description: "Access levels that control who may see parts of the listing on Homes.com."
        newHomesInfo:
          allOf:
            - "$ref": "#/components/schemas/NewHomesInfo"
          nullable: true
          description: "Extra details for new-construction listings, such as the community, builder and floor plan. Filled on few listings."
        offices:
          type: "array"
          items:
            "$ref": "#/components/schemas/MlsOffice"
          nullable: true
          description: "The MLS offices (brokerages) on the listing, with their contact details."
        source:
          allOf:
            - "$ref": "#/components/schemas/Source"
          nullable: true
          description: "Where the listing information came from: the MLS listing id and kind of data."
        history:
          type: "array"
          items:
            "$ref": "#/components/schemas/ListingHistory"
          nullable: true
          description: "Events in the life of the listing, such as new, price change, under contract and sold."
        isPrimaryForThisListingInstance:
          type: "boolean"
          description: "Whether this is the primary MLS listing among those of the same sale or rent attempt."
        attributionContact:
          type: "string"
          nullable: true
          description: "Contact for crediting the listing under IDX rules, such as a phone number or email. Filled on few listings."
        displayPrice:
          allOf:
            - "$ref": "#/components/schemas/DisplayPrice"
          nullable: true
          description: "Price information Homes.com shows to the public for a sold or recently off-market home: recent sale values and the latest automated value estimate."
        has3DTour:
          type: "boolean"
          description: "Whether the listing has a 3D tour."
        hasOtherRecentlySoldOrOffMarketListings:
          type: "boolean"
          description: "Whether the home has other recently sold or off-market listings."
        hasVideo:
          type: "boolean"
          description: "Whether the listing has a video."
        costarFeatureValues:
          allOf:
            - "$ref": "#/components/schemas/CostarFeatureValues"
          nullable: true
          description: "Home features detected by CoStar from photos and listing text, as a counterpart to resoValues."
        isInCondoBuilding:
          type: "boolean"
          description: "Whether the home is part of a condo building."
        mls:
          allOf:
            - "$ref": "#/components/schemas/Mls"
          nullable: true
          description: "The MLS (multiple listing service) that supplied the listing and its display rules."
    ResidentialListingFeatures:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Id of the MLS listing, the same as `id` in residential-listings. Each record in this file is the feature text of one listing."
        highlights:
          type: "array"
          items:
            "$ref": "#/components/schemas/ResidentialListingFeatureHighlight"
          description: "The listing's highlights in display order: the short list of standout features Homes.com shows at the top of the listing page."
        sections:
          type: "array"
          items:
            "$ref": "#/components/schemas/ResidentialListingFeatureSection"
          description: "The listing's details as display lines, grouped by category and subcategory in display order. This is the details section of the Homes.com listing page: every feature sentence, plus every feature with no sentence under its own name."
        features:
          type: "array"
          items:
            "$ref": "#/components/schemas/ResidentialListingFeature"
          description: "Every feature on the listing, one entry per feature, in display order. A feature with no value is simply present."
        derivedValues:
          allOf:
            - "$ref": "#/components/schemas/ResidentialListingDerivedValues"
          description: "Totals and summary values worked out from the features."
    CompanyDetail:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Id of the company location, the `tenantLocationId` of location-occupancy. Each record is one office or site of a company."
        address:
          allOf:
            - "$ref": "#/components/schemas/LocationDetailAddress"
          nullable: true
          description: "Street address of the company location. For most locations this is the address of the building it occupies."
        aliases:
          type: "array"
          items:
            type: "string"
          description: "Other names the company location is known by, such as a former or legal name."
        businessStatus:
          allOf:
            - "$ref": "#/components/schemas/LocationBusinessStatus"
          description: "Whether the company location is still in business. Out-of-business locations are included; their past tenancies are in location-occupancy."
        locationPhone:
          type: "string"
          nullable: true
          description: "Main phone number of the company location. The number is fake: area code 555, the same fake for the same real number in every dataset."
        locationPhoneCountryCode:
          type: "string"
          nullable: true
          description: "Three-letter country code of `locationPhone`."
        numEmployees:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of employees at this location, as researched by CoStar."
        profile:
          allOf:
            - "$ref": "#/components/schemas/LocationDetailProfile"
          nullable: true
          description: "The company profile shown for this location: its type, industry, website and description."
        mailingAddress:
          allOf:
            - "$ref": "#/components/schemas/LocationDetailAddress"
          nullable: true
          description: "Postal address of the company location, when it differs from or adds to `address`, such as a PO box."
        name:
          type: "string"
          nullable: true
          description: "Name of the company location, such as `The Hileman Company LLC`."
        officeType:
          allOf:
            - "$ref": "#/components/schemas/OfficeType"
          description: "What this location is to its company, such as main headquarters, branch or single location."
        suite:
          type: "string"
          nullable: true
          description: "Suite or unit at the address, as entered. Values can carry trailing spaces."
        brandProfiles:
          type: "array"
          items:
            "$ref": "#/components/schemas/LocationBrandProfile"
          description: "Brands the location operates under, on the few locations that have one."
        latitude:
          type: "number"
          nullable: true
          description: "A map position for the location itself, on 164 records. It is usually within about 100 meters of `address.latitude` and `address.longitude`; prefer those."
        longitude:
          type: "number"
          nullable: true
          description: "Longitude of the location's own map position, on 164 records. Prefer `address.longitude`."
    ApartmentListing:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Id of the listing: one apartment community's rental listing. It is unique in the file, and so is `propertyId`."
        propertyId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the community, the `id` of its commercial-property record."
        buildingName:
          type: "string"
          nullable: true
          description: "Marketing name of the community, such as `City Lights on Fig`. Empty on 59 records."
        address:
          allOf:
            - "$ref": "#/components/schemas/ApartmentListingAddress"
          nullable: true
          description: "Street address of the community: the property's primary address, with latitude and longitude."
        yearBuilt:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Year the community was built."
        totalNumUnits:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of units in the community."
        totalActiveUnits:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of units across the floor plans in `apartmentModels`; the sum of their `numUnits`. It equals `totalNumUnits` on 1,597 records."
        numUnitsAvailable:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of units that can be rented now, the sum of the floor plans' `numUnitsAvailable`. Null on 11 records and 0 on 70."
        minRent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Lowest asking rent across the community's floor plans, in dollars per month. 0 means no rent was given (571 records)."
        maxRent:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Highest asking rent across the community's floor plans, in dollars per month."
        monetaryUnit:
          allOf:
            - "$ref": "#/components/schemas/MonetaryUnit"
          nullable: true
          description: "Currency of the rents: 1 (US dollars) on 1,665 records and 0 (Unknown) on 82. Every community is in Texas or California."
        minSquareFeet:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Size of the smallest unit across the floor plans, in square feet."
        maxSquareFeet:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Size of the largest unit across the floor plans, in square feet."
        lifestyleType:
          allOf:
            - "$ref": "#/components/schemas/ApartmentLifestyleType"
          nullable: true
          description: "Who the community is for: 1 (All) the general market, 2 Senior, 3 Student, 5 Corporate. 0 on 4 records."
        primarySubmarketId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the community's CoStar submarket, as `primarySubmarketId` on the property record. The kit has ids only."
        propertyManagementCompanyId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the company location that manages the community. It joins to company-detail `id` on 1,072 records."
        propertyManagementCompanyName:
          type: "string"
          nullable: true
          description: "Name of the management company, such as `Greystar Real Estate Partners`."
        propertyManagementCompanyHqLocationId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Id of the management company's headquarters location. It joins to company-detail `id` on 116 records."
        primaryPhoto:
          allOf:
            - "$ref": "#/components/schemas/ApartmentListingPhoto"
          nullable: true
          description: "The community's main photo."
        apartmentModels:
          type: "array"
          items:
            "$ref": "#/components/schemas/ApartmentListingFloorPlan"
          description: "The community's floor plans, one entry each, with units, availability, size and asking rent."
    CommercialPropertyAddress:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int32"
          description: "Unique integer identifier of the address record; the stable key other entities join to when referencing this location."
        buildingNumber:
          type: "string"
          nullable: true
          description: "Building number identifying a specific structure within a multi-building site or campus at the address."
        buildingName:
          type: "string"
          nullable: true
          description: "Proper name of the building at the address, e.g. a named office tower or community, used in marketing and identification."
        city:
          type: "string"
          nullable: true
          description: "City name text of the address; an admin-geography label. Join to GeoEntities_City on cityId, never on this name string, since city names recur globally."
        cityId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the city containing the address; the integer key to join to GeoEntities_City instead of the City name string."
        countyId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Integer identifying the county, the largest geographical subdivision of most US states. The District of Columbia and Ontario are current exceptions."
        countyName:
          type: "string"
          nullable: true
          description: "Not populated in this dataset; expect null."
        countryCode:
          type: "string"
          nullable: true
          description: "Country code of the address; top-level admin-geography scope. Resolves to GeoEntities_Country and disambiguates globally recurring city/state names."
        crossStreetDescription:
          type: "string"
          nullable: true
          description: "Free-text description of the nearest cross streets or intersection, used to locate or market the property by its corner or block."
        latitude:
          type: "number"
          nullable: true
          description: "Geocoded latitude coordinate of the address used for mapping and spatial analysis; nullable when geocoding is unresolved."
        longitude:
          type: "number"
          nullable: true
          description: "Geocoded longitude coordinate of the address used for mapping and spatial analysis; nullable when geocoding is unresolved."
        postalBox:
          type: "string"
          nullable: true
          description: "Post-office box designation for the address when mail is delivered to a PO box rather than the street location."
        postcode:
          type: "string"
          nullable: true
          description: "Postal code of the address (international term for ZIP); part of admin geography."
        researchMarketId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier to the ResearchMarket. Replaces the legacy 3-digit market code that generally corresponded to a major city (e.g. 'ATL' for Atlanta)."
        state:
          type: "string"
          nullable: true
          description: "State or province text of the address; an admin-geography label. Resolve via stateId rather than this string for joins."
        stateId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the state/province containing the address; the integer key for state-grain joins rather than the State name string."
        streetDirection:
          type: "string"
          nullable: true
          description: "Directional prefix or component of the street name such as N, SW, or East."
        streetName:
          type: "string"
          nullable: true
          description: "Name of the street the property fronts, e.g. Main in 1200 Main St."
        streetNumber:
          type: "string"
          nullable: true
          description: "Street (house) number portion of the street address, e.g. the 1200 in 1200 Main St."
        streetNumberEndRange:
          type: "string"
          nullable: true
          description: "Upper bound of the street-number range when the property spans multiple addresses, e.g. the 1210 in a 1200-1210 frontage."
        streetType:
          type: "string"
          nullable: true
          description: "Street thoroughfare type designation such as St, Ave, Blvd, or Rd."
        streetSuffix:
          type: "string"
          nullable: true
          description: "Trailing directional suffix of the street address, e.g. the NW in 1200 Main St NW."
        submarketIds:
          type: "array"
          items:
            type: "integer"
            format: "int32"
          description: "Identifiers of the CoStar Submarkets this address belongs to; join to GeoEntities_Submarket on these IDs. Submarkets are building-type-specific and a point can sit in different submarkets per property type."
    CommercialPropertyConstructionEvent:
      type: "object"
      properties:
        eventType:
          allOf:
            - "$ref": "#/components/schemas/ConstructionEventType"
          description: "Identifies the type of construction lifecycle event for the property (e.g. yearBuilt, renovated, expanded); the artificial primary key of the construction event."
        year:
          type: "integer"
          format: "int32"
          description: "Year in which the construction event occurred (e.g. year built or renovated)."
        month:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Month in which the construction event occurred, when known."
    CommercialPropertyParcelReference:
      type: "object"
      properties:
        countyId:
          type: "integer"
          format: "int32"
          description: "Identifier of the county whose assessor maintains the parcel, scoping the parcel number; joins to GeoEntities_County. Parcel numbers are only unique within a county."
        parcelNumber:
          type: "string"
          nullable: true
          description: "County assessor's parcel number (APN) identifying the legal land parcel a property sits on, used to tie the property to public tax/ownership records."
    CommercialPropertyParking:
      type: "object"
      properties:
        parkingType:
          allOf:
            - "$ref": "#/components/schemas/ParkingType"
          description: "Identifies the type of parking provided at the property."
        totalSpaces:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Total spaces for vehicles (cars or trailers) of this parking type; drives the parking ratio (spaces per 1,000 SF)."
        monthlyParkingFee:
          type: "number"
          nullable: true
          description: "Monthly parking fee charged for a vehicle (car or trailer); parking is an other-income source affecting EGI."
    CommercialPropertyDimensions:
      type: "object"
      properties:
        width:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Width taken from the attachment's dimensions."
        height:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Height taken from the attachment's dimensions."
    CommercialPropertyAttachmentReference:
      type: "object"
      properties:
        attachmentMasterId:
          type: "integer"
          format: "int32"
          description: "Identifies a file describing a given entity. The file can be any format, including document, spreadsheet, JPEG, GIF, Bitmap, etc."
        attachmentType:
          allOf:
            - "$ref": "#/components/schemas/AttachmentType"
          description: "Logical representation of the attachment. Values include: Aerial Photo, Argus Financial, Building Photo, Contract, Floor Plan, Investment Package, Image, iPIX Virtual Tour, Lobby, Locational Map, Logo, Outlook Contact Card, Photograph, Plat Map, Presentation, Spreadsheet."
        attachmentTypeExtension:
          allOf:
            - "$ref": "#/components/schemas/AttachmentTypeExtension"
          description: "The file extension/type of the attachment (e.g., DOC, PDF, JPG, GIF, TIF, XLS, etc.)."
        caption:
          type: "string"
          nullable: true
          description: "Short description about the attachment."
        attachmentUri:
          type: "string"
          nullable: true
          description: "Link to the attachment's file on CoStar's CDN, set on published attachments only. Image links are at size 112 (up to 1,880 by 900 pixels); replace the /112/ segment with another size id to get another size."
        dimensions:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyDimensions"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Image size container copied from the attachment's dimensions."
        originationDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the attachment was created."
        videoKey:
          type: "string"
          nullable: true
          description: "External key/identifier of the associated video asset, when the attachment is a video."
        videoExternalReferenceType:
          allOf:
            - "$ref": "#/components/schemas/ExternalReferenceType"
          description: "External-reference type indicating the video hosting provider/source for the videoKey."
    Dimensions:
      type: "object"
      properties:
        width:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Width taken from the attachment's dimensions."
        height:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Height taken from the attachment's dimensions."
    PropertyAttachment:
      type: "object"
      properties:
        attachmentMasterId:
          type: "integer"
          format: "int32"
          description: "Identifies a file describing a given entity. The file can be any format, including document, spreadsheet, JPEG, GIF, Bitmap, etc."
        attachmentType:
          allOf:
            - "$ref": "#/components/schemas/AttachmentType2"
          description: "Logical representation of the attachment. Values include: Aerial Photo, Argus Financial, Building Photo, Contract, Floor Plan, Investment Package, Image, iPIX Virtual Tour, Lobby, Locational Map, Logo, Outlook Contact Card, Photograph, Plat Map, Presentation, Spreadsheet."
        attachmentTypeExtension:
          allOf:
            - "$ref": "#/components/schemas/AttachmentTypeExtension"
          description: "The file extension/type of the attachment (e.g., DOC, PDF, JPG, GIF, TIF, XLS, etc.)."
        caption:
          type: "string"
          nullable: true
          description: "Short description about the attachment."
        attachmentUri:
          type: "string"
          nullable: true
          description: "Link to the attachment's file on CoStar's CDN, set on published attachments only. Image links are at size 112 (up to 1,880 by 900 pixels); replace the /112/ segment with another size id to get another size."
        dimensions:
          allOf:
            - "$ref": "#/components/schemas/Dimensions"
          nullable: true
          description: "Pixel/size dimensions of the media asset (read-only from master). Image size container copied from the attachment's dimensions."
        originationDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "When the attachment was created."
        videoExternalReferenceType:
          allOf:
            - "$ref": "#/components/schemas/ExternalReferenceType2"
          description: "External-reference type indicating the video hosting provider/source for the videoKey."
        videoKey:
          type: "string"
          nullable: true
          description: "External key/identifier of the associated video asset, when the attachment is a video."
    CommercialPropertyRenovation:
      type: "object"
      properties:
        renovationExtent:
          allOf:
            - "$ref": "#/components/schemas/RenovationExtent"
          description: "Code indicating the scope/extent of the renovation (cosmetic, gut, full redevelopment)."
        startDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Date the renovation work began."
        endDate:
          type: "string"
          format: "date-time"
          description: "Date the renovation was completed; renovated/year-renovated affects effective age and value."
        renovationPrice:
          type: "integer"
          format: "int64"
          nullable: true
          description: "Cost spent on the renovation/redevelopment."
        renovationImprovementTypes:
          type: "array"
          items:
            "$ref": "#/components/schemas/RenovationImprovementType"
          description: "Collection of improvement types describing what the renovation upgraded (roof, HVAC, facade, etc.)."
    CommercialPropertyElevator:
      type: "object"
      properties:
        elevatorType:
          allOf:
            - "$ref": "#/components/schemas/ElevatorType"
          description: "The type of elevator at the property (passenger, freight, or escalator)."
        numElevators:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of elevators of this type at the property (when known; n/a when elevatorState is unknown or does-not-exist)."
        elevatorState:
          allOf:
            - "$ref": "#/components/schemas/RecordStateType"
          description: "State of what is known about this elevator type at the property: 0 = unknown, 1 = exists, 2 = does not exist. Only states 1 and 2 should persist."
    CommercialPropertyStructural:
      type: "object"
      properties:
        columnDepthFeet:
          type: "number"
          nullable: true
          description: "Upper end of the range of spacing between rows of columns, in feet. Maximum column depth, or the minimum when no maximum is recorded."
        columnWidthFeet:
          type: "number"
          nullable: true
          description: "Upper end of the range of spacing between columns, in feet. Maximum column width, or the minimum when no maximum is recorded."
        maxColumnDepthFeet:
          type: "number"
          nullable: true
          description: "Upper end of the range of spacing between rows of columns, in feet."
        minColumnDepthFeet:
          type: "number"
          nullable: true
          description: "Lower end of the range of spacing between rows of columns, in feet."
        maxColumnWidthFeet:
          type: "number"
          nullable: true
          description: "Upper end of the range of spacing between columns, in feet."
        minColumnWidthFeet:
          type: "number"
          nullable: true
          description: "Lower end of the range of spacing between columns, in feet."
        minFloorThicknessInches:
          type: "number"
          nullable: true
          description: "Floor thickness in inches, representing the lower end of a range of values."
        maxFloorThicknessInches:
          type: "number"
          nullable: true
          description: "Floor thickness in inches, representing the upper end of a range of values."
        ceilingHeightFeet:
          type: "number"
          nullable: true
          description: "Maximum ceiling height in inches (remainder after whole feet), the upper end of a range; primarily Retail and Industrial). Whole feet of the maximum ceiling height (minimum if no maximum), converted from inches; null when that is under 12 inches."
        ceilingHeightInches:
          type: "number"
          nullable: true
          description: "Maximum ceiling height in inches (remainder after whole feet), the upper end of a range; primarily Retail and Industrial). Leftover inches after removing whole feet from the maximum ceiling height (minimum if no maximum); null when the height is an exact number of feet."
        hasBuildingColumns:
          type: "boolean"
          nullable: true
          description: "One of three knowledge states for building columns on the property: 0 = nothing known about building columns; 1 = the property has building columns (details may exist in PropertyBuildingColumn); 2 = the property does not have building columns. True if the building-column state is Yes, false if No, otherwise null."
        floorThicknessInches:
          type: "number"
          nullable: true
          description: "Floor thickness in inches, representing the upper end of a range of values. Maximum floor thickness, or the minimum when no maximum is recorded."
        floorLoadPoundsPerSquareFoot:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Floor load capacity in pounds per square foot (upper end of a range). Maximum floor load, or the minimum when no maximum is recorded."
        slabToSlabHeightFeet:
          type: "number"
          nullable: true
          description: "Distance in whole feet between the slabs of adjoining floors (Office only)."
        elevators:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyElevator"
          description: "Collection of elevator records describing the property's vertical-transportation equipment by type and count."
    CommercialPropertyOffice:
      type: "object"
      properties:
        rentableBuildingAreaSquareFeet:
          type: "number"
          nullable: true
          description: "Rentable Building Area (RBA): area inside the walls excluding vertical shafts but including common areas — the leasing/revenue/investing basis and the vacancy denominator. RBA used for all uses except retail (which uses GLA); must be <= GBA. Square-foot value of the property's rentable building area, taken from the base property record."
        coreFactor:
          type: "number"
          nullable: true
          description: "Upper bound of the office building's core (loss) factor — the share of rentable area (RBA) that is shared common space (lobbies, corridors) rather than usable tenant space. Surfaced as the 'Core Factor' building stat. coreFactor = (RBA - Usable) / RBA; orientation unverified. High end of the core-factor range, or the low end when no high end is recorded."
        coreFactorHighRange:
          type: "number"
          nullable: true
          description: "Upper bound of the office building's core (loss) factor — the share of rentable area (RBA) that is shared common space (lobbies, corridors) rather than usable tenant space. Surfaced as the 'Core Factor' building stat. coreFactor = (RBA - Usable) / RBA; orientation unverified."
        coreFactorLowRange:
          type: "number"
          nullable: true
          description: "Lower bound of the office building's core (loss) factor — the share of rentable area (RBA) that is shared common space (lobbies, corridors) rather than usable tenant space. Surfaced as the 'Core Factor' building stat. coreFactor = (RBA - Usable) / RBA; orientation unverified."
        isOwnerOccupied:
          type: "boolean"
          nullable: true
          description: "Whether the property is occupied by its owner (owner/user) versus leased to third-party tenants; relevant to sale type (owner/user vs investment)."
        tenancyType:
          allOf:
            - "$ref": "#/components/schemas/TenancyType"
          description: "Whether the building is single-tenant or multi-tenant occupancy, affecting leasing and valuation characteristics."
        structural:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyStructural"
          nullable: true
          description: "Built from the structural record (columns, ceiling and floor, elevators); null when the property has no structural record."
    LineString:
      type: "object"
      properties:
        type:
          allOf:
            - "$ref": "#/components/schemas/GeoObjectType"
          description: "Geometry type; LineString for a frontage."
        coordinates:
          type: "array"
          items:
            type: "array"
            items:
              type: "number"
            minItems: 2
            maxItems: 3
          description: "Points along the frontage line, in order."
        boundingBox:
          type: "array"
          items:
            type: "number"
            format: "double"
          nullable: true
          description: "Bounding box of the frontage line, as minimum and maximum longitude and latitude."
    CommercialPropertyFrontageFootprint:
      type: "object"
      properties:
        shape:
          allOf:
            - "$ref": "#/components/schemas/LineString"
          nullable: true
          description: "Geospatial line geometry (LineString) tracing the frontage along the street. The frontage line geometry copied unchanged."
        distanceFeet:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Geospatial line geometry (LineString) tracing the frontage along the street. Length of the frontage line in feet, summing great-circle distances between consecutive points, rounded to a whole number."
    CommercialPropertyFrontage:
      type: "object"
      properties:
        streetName:
          type: "string"
          nullable: true
          description: "Name of the street on which the property fronts."
        frontageInFeet:
          type: "number"
          nullable: true
          description: "Linear feet of frontage along this street; greater frontage means more retail visibility and access. Displayed as a distance per the user/property unit-of-measurement preference (feet vs meters)."
        numCurbCuts:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of cut-outs in the curb along this frontage of the property."
        isPrimaryFrontage:
          type: "boolean"
          description: "Indicates whether this frontage is on the side of the property with the main entrance. Primary frontage should be displayed in products ahead of non-primary frontage."
        footprint:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyFrontageFootprint"
          nullable: true
          description: "Geospatial line geometry (LineString) tracing the frontage along the street. Container for the frontage line shape and its computed length."
    CommercialPropertyRetail:
      type: "object"
      properties:
        grossLeasableAreaSquareFeet:
          type: "number"
          nullable: true
          description: "Rentable Building Area (RBA): area inside the walls excluding vertical shafts but including common areas — the leasing/revenue/investing basis and the vacancy denominator. RBA used for all uses except retail (which uses GLA); must be <= GBA. Square-foot value of the property's rentable building area, taken from the base property record."
        maxBuildingDepthFeet:
          type: "number"
          nullable: true
          description: "Maximum allowed value is 500 feet."
        minBuildingDepthFeet:
          type: "number"
          nullable: true
          description: "Maximum allowed value is 500 feet."
        tenancyType:
          allOf:
            - "$ref": "#/components/schemas/TenancyType"
          description: "Whether the building is single-tenant or multi-tenant occupancy, affecting leasing and valuation characteristics."
        frontage:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyFrontage"
          description: "Collection of the retail property's frontage records (road-facing edges); street, footage, traffic count, and curb cuts."
        numExternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of loading docks that are external to the property structure."
        numInternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of loading docks located within the structure of the property."
        structural:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyStructural"
          nullable: true
          description: "Built from the structural record (columns, ceiling and floor, elevators); null when the property has no structural record."
    CommercialPropertyDriveInBay:
      type: "object"
      properties:
        numDriveInBays:
          type: "number"
          nullable: true
          description: "The number of drive-in bays on the property."
        numFeetWide:
          type: "number"
          nullable: true
          description: "The width of a drive-in bay, in feet (to the nearest whole foot)."
        numFeetHigh:
          type: "number"
          nullable: true
          description: "The height of a drive-in bay, in feet (to the nearest whole foot)."
    CommercialPropertyRailAccess:
      type: "object"
      properties:
        railCompanyId:
          type: "integer"
          format: "int32"
          description: "Identifies the company supplying rail access to the property."
        description:
          type: "string"
          nullable: true
          description: "Text description of miscellaneous information about the rail access on the property."
        numExternalRailSpots:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of rail access points on the property that are outside rather than within a structure."
        numInternalRailSpots:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of rail access points inside the structure on the property."
    CommercialPropertyTruckWell:
      type: "object"
      properties:
        total:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of truck wells at the property."
        numTrucksPerWell:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of trucks that can fit in a truck well."
        truckCourtLengthInFeet:
          type: "number"
          nullable: true
          description: "The length of the truck court, in feet."
    CommercialPropertyCrane:
      type: "object"
      properties:
        numCranes:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of cranes available on the property."
        craneHookHeightFeet:
          type: "number"
          nullable: true
          description: "The height of the crane's hook, in feet."
        minCraneWeightTons:
          type: "number"
          nullable: true
          description: "The load capacity of the crane in tons (lower range)."
        maxCraneWeightTons:
          type: "number"
          nullable: true
          description: "The load capacity of the crane in tons (upper range)."
    CommercialPropertyElectric:
      type: "object"
      properties:
        hasHeavyPower:
          type: "boolean"
          nullable: true
          description: "Tri-state indicator of whether the property has heavy electric power (amperage of at least 800, i.e. ampsHigh >= 800): 0 = unknown, 1 = has heavy power, 2 = known not to. Heavy power is a defining industrial-building attribute; amp/volt detail lives on the Electric child. True if the heavy-power state is Yes, false if No, otherwise null."
        ampsLow:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The strength of electric current supplied to the property, in amperes. Can express the low end of a range; usually used for properties with \"heavy power\"."
        ampsHigh:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The strength of electric current supplied to the property, in amperes. Can express the high end of a range; usually used for properties with \"heavy power\"."
        voltsLow:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The potential of electric current supplied to the property, in volts. Can express the low end of a range; usually used for properties with \"heavy power\"."
        voltsHigh:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The potential of electric current supplied to the property, in volts. Can express the high end of a range; usually used for properties with \"heavy power\"."
        numWiresCarryingElectric:
          type: "integer"
          format: "int32"
          nullable: true
          description: "How many wires are used to carry the electric power. For example, if a ground wire is present the measurement would be 3; if there is a separate incoming wire for large currents it would be 4."
        numElectricCurrentPhases:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of phases, referring to the synchronicity between current flowing on different wires. Three-phase power, used extensively in industrial machinery, has 3 \"hot\" wires 120 degrees out of phase with each other."
        description:
          type: "string"
          nullable: true
          description: "Captures any miscellaneous descriptive information about the electric service at the property."
    CommercialPropertyUtility:
      type: "object"
      properties:
        utilityType:
          allOf:
            - "$ref": "#/components/schemas/UtilityType"
          description: "Primary utility category available at the property (e.g. water, gas, sewer, electric)."
        utilitySubType:
          allOf:
            - "$ref": "#/components/schemas/UtilitySubType"
          nullable: true
          description: "Finer classification of the utility (e.g. service type or provider arrangement)."
    CommercialPropertyIndustrial:
      type: "object"
      properties:
        rentableBuildingAreaSquareFeet:
          type: "number"
          nullable: true
          description: "Rentable Building Area (RBA): area inside the walls excluding vertical shafts but including common areas — the leasing/revenue/investing basis and the vacancy denominator. RBA used for all uses except retail (which uses GLA); must be <= GBA. Square-foot value of the property's rentable building area, taken from the base property record."
        isOwnerOccupied:
          type: "boolean"
          nullable: true
          description: "Whether the property is occupied by its owner (owner/user) versus leased to third-party tenants; relevant to sale type (owner/user vs investment)."
        tenancyType:
          allOf:
            - "$ref": "#/components/schemas/TenancyType"
          description: "Whether the building is single-tenant or multi-tenant occupancy, affecting leasing and valuation characteristics."
        driveInBays:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyDriveInBay"
          nullable: true
          description: "Drive-in bay profile for the industrial property (count and door clear width/height for grade-level access)."
        railAccess:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyRailAccess"
          nullable: true
          description: "Collection of rail-access records (rail carrier and rail-spot counts) describing the industrial property's rail service. Rail access entries from the subtype record, dropping empty entries."
        truckWells:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyTruckWell"
          nullable: true
          description: "Truck-well profile for the industrial property (count, trucks per well, truck-court depth) for loading logistics."
        cranes:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyCrane"
          nullable: true
          description: "Crane profile for the industrial property (count, hook height, lift capacity); a heavy-handling attribute."
        electric:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyElectric"
          nullable: true
          description: "Electrical/power profile for the industrial property (amps, volts, phases), describing heavy-power capability. Electrical details from the subtype record; always present for Flex and Industrial, with null fields when the record has none."
        utilities:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyUtility"
          description: "Collection of utility records (water, gas, sewer, electric and their availability state) for the industrial property. Utilities from the subtype record, keeping only those whose state is Yes."
        numExternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of loading docks that are external to the property."
        numInternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of loading docks that are within the structure of the property."
        numExternalLevelers:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of levelers (a kind of loading dock) that are external to the property."
        numInternalLevelers:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of levelers (a kind of loading dock) that are within the structure of the property."
        maxBuildingDepthFeet:
          type: "number"
          nullable: true
          description: "The upper range of the number of feet of the building below ground. Maximum value of 500 feet."
        minBuildingDepthFeet:
          type: "number"
          nullable: true
          description: "The lower range of the number of feet of the building below ground. Maximum value of 500 feet."
        hasCrossDocks:
          type: "boolean"
          nullable: true
          description: "Tri-state indicator of whether any of the property's loading docks are cross docks: 0 = nothing is known about whether any docks are cross docks; 1 = some or all loading docks are cross docks; 2 = none of the loading docks are cross docks. True if the cross-dock state is Yes, false if No, otherwise null."
        hasCranes:
          type: "boolean"
          nullable: true
          description: "Tri-state indicator of crane information for the property: 0 = nothing is known about cranes; 1 = the property has cranes (details may exist in PropertyCrane); 2 = the property does not have cranes. True if the crane state is Yes, false if No, otherwise null."
        hasLoadingDocks:
          type: "boolean"
          nullable: true
          description: "Tri-state indicator of loading-dock information for the property: 0 = nothing is known about loading docks; 1 = the property has loading docks (details may exist in PropertyLoadingDock); 2 = the property does not have loading docks. True if the loading-dock state is Yes, false if No, otherwise null."
        hasLevelers:
          type: "boolean"
          nullable: true
          description: "Tri-state indicator of whether any of the property's loading docks are levelers: 0 = nothing is known about whether any docks are levelers; 1 = some or all loading docks are levelers; 2 = none of the loading docks are levelers. True if the leveler state is Yes, false if No, otherwise null."
        hasDriveInBays:
          type: "boolean"
          nullable: true
          description: "Tri-state indicator of drive-in-bay information for the property: 0 = nothing is known about drive-in bays; 1 = the property has drive-in bays (details may exist in PropertyDriveInBay); 2 = the property does not have drive-in bays. True if the drive-in-bay state is Yes, false if No, otherwise null."
        structural:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyStructural"
          nullable: true
          description: "Built from the structural record (columns, ceiling and floor, elevators); null when the property has no structural record."
    CommercialPropertyFlex:
      type: "object"
      properties:
        rentableBuildingAreaSquareFeet:
          type: "number"
          nullable: true
          description: "Rentable Building Area (RBA): area inside the walls excluding vertical shafts but including common areas — the leasing/revenue/investing basis and the vacancy denominator. RBA used for all uses except retail (which uses GLA); must be <= GBA. Square-foot value of the property's rentable building area, taken from the base property record."
        isOwnerOccupied:
          type: "boolean"
          nullable: true
          description: "Whether the property is occupied by its owner (owner/user) versus leased to third-party tenants; relevant to sale type (owner/user vs investment)."
        coreFactor:
          type: "number"
          nullable: true
          description: "Maximum Core Factor: the common area expressed as a percentage of net rentable area (RBA) — space shared by all tenants (lobbies, rest rooms, corridors), excluding stairwells/elevators. coreFactor = (RBA − Usable) / RBA. High end of the core-factor range, or the low end when no high end is recorded."
        tenancyType:
          allOf:
            - "$ref": "#/components/schemas/TenancyType"
          description: "Whether the building is single-tenant or multi-tenant occupancy, affecting leasing and valuation characteristics."
        driveInBays:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyDriveInBay"
          nullable: true
          description: "Drive-in bay profile for the flex property (count and door clear width/height for grade-level vehicle access)."
        railAccess:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyRailAccess"
          nullable: true
          description: "Collection of rail-access records (rail carrier and rail-spot counts) describing the flex property's rail service. Rail access entries from the subtype record, dropping empty entries."
        truckWells:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyTruckWell"
          nullable: true
          description: "Truck-well profile for the flex property (count, trucks per well, truck-court depth) for loading logistics."
        cranes:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyCrane"
          nullable: true
          description: "Crane profile for the flex property (count, hook height, lift capacity); an industrial heavy-handling attribute."
        electric:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyElectric"
          nullable: true
          description: "Electrical/power profile for the flex property (amps, volts, phases), describing heavy-power capability. Electrical details from the subtype record; always present for Flex and Industrial, with null fields when the record has none."
        utilities:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyUtility"
          description: "Collection of utility records (water, gas, sewer, electric and their availability state) for the flex property. Utilities from the subtype record, keeping only those whose state is Yes."
        numExternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of loading docks that are external to the property."
        numInternalLoadingDocks:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of loading docks that are within the structure of the property."
        numExternalLevelers:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of levelers (a kind of loading dock) that are external to the property."
        numInternalLevelers:
          type: "integer"
          format: "int32"
          nullable: true
          description: "The number of levelers (a kind of loading dock) that are within the structure of the property."
        maxBuildingDepthFeet:
          type: "number"
          nullable: true
          description: "Upper range of the number of feet of the building below ground. Maximum value of 500 feet."
        minBuildingDepthFeet:
          type: "number"
          nullable: true
          description: "Lower range of the number of feet of the building below ground. Maximum value of 500 feet."
        hasLoadingDocks:
          type: "boolean"
          nullable: true
          description: "Three-state indicator of loading docks on the property: 0 = nothing known, 1 = property has loading docks (details may exist in PropertyLoadingDock), 2 = property does not have loading docks. True if the loading-dock state is Yes, false if No, otherwise null."
        hasLevelers:
          type: "boolean"
          nullable: true
          description: "Tri-state indicator of whether any of the property's loading docks are levelers: 0 = nothing is known about whether any docks are levelers; 1 = some or all loading docks are levelers; 2 = none of the loading docks are levelers. True if the leveler state is Yes, false if No, otherwise null."
        hasDriveInBays:
          type: "boolean"
          nullable: true
          description: "Three-state indicator of drive-in bays on the property: 0 = nothing known, 1 = property has drive-in bays (details may exist in PropertyDriveInBay), 2 = property does not have drive-in bays. True if the drive-in-bay state is Yes, false if No, otherwise null."
        structural:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyStructural"
          nullable: true
          description: "Built from the structural record (columns, ceiling and floor, elevators); null when the property has no structural record."
    CommercialPropertyHospitalityRoom:
      type: "object"
      properties:
        roomType:
          allOf:
            - "$ref": "#/components/schemas/RoomType"
          description: "Classification of the hotel room product (e.g. standard, suite); the unit of the hotel's room-mix breakdown."
        numRooms:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of rooms of this type in the hotel's inventory."
        averageRoomSquareFeet:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Average floor area of a room of this type in square feet."
        averageDailyRate:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Average daily rate (ADR) charged for this room type; a core hospitality revenue metric."
        dailyRateLow:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Lower bound of the daily rate range for this room type."
        dailyRateHigh:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Upper bound of the daily rate range for this room type."
        monetaryUnit:
          allOf:
            - "$ref": "#/components/schemas/MonetaryUnit"
          nullable: true
          description: "Currency/monetary unit in which the room rates are expressed."
    CommercialPropertyHospitality:
      type: "object"
      properties:
        buildingFullName:
          type: "string"
          nullable: true
          description: "Full name of the hotel building/property as marketed."
        averageOccupancyPercent:
          type: "number"
          nullable: true
          description: "Average share of available rooms occupied (Demand Rooms / Supply Rooms); a primary hospitality performance KPI alongside ADR and RevPAR, derived from STR-style research."
        averageDailyPricePerRoom:
          type: "number"
          nullable: true
          description: "Average Daily Rate (ADR) = total room revenue / total occupied (demand) rooms; the core hospitality benchmark of room pricing per night."
        averageUnitSizeSquareFeet:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Average guest-room size in square feet, indicating room product quality and class."
        revenuePerAvailableRoom:
          type: "number"
          nullable: true
          description: "RevPAR = total room revenue / available (supply) rooms (equivalently ADR × Occupancy); the headline hospitality performance metric."
        furnitureFixtureEquipmentValue:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Estimated value of furniture, fixtures and equipment (FF&E) at the hotel — the movable, non-real-estate component of going-concern hotel value (and soft goods such as linens); relevant when separating real property from business value in hotel sale comparability."
        hotelBrandId:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Identifier of the hotel's flag/brand (e.g. Marriott, Hilton brand); a key hospitality firmographic attribute."
        hotelBrandName:
          type: "string"
          nullable: true
          description: "Name of the hotel brand/flag (e.g. a chain or banner). Name of the hotel brand referenced by the hotel record; null when no brand is found."
        corridorType:
          allOf:
            - "$ref": "#/components/schemas/CorridorType"
          nullable: true
          description: "Code describing the hotel's corridor configuration (interior vs exterior room access), a product-class attribute."
        hotelRating:
          allOf:
            - "$ref": "#/components/schemas/HotelRating"
          nullable: true
          description: "Quality rating of the hotel (e.g. star/diamond grade) indicating service and amenity level."
        hotelRatingYear:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Year the hotel rating was assigned, anchoring the rating to a point in time."
        numUnits:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of guest rooms (keys) in the hotel; the core hospitality size attribute driving capacity and per-room metrics."
        numResidences:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Number of branded-residence units associated with the hotel (condo-hotel or residential component)."
        emailAddress:
          type: "string"
          nullable: true
          description: "Contact email address for the hotel."
        phoneNumber:
          type: "string"
          nullable: true
          description: "Contact phone number for the hotel."
        phoneNumberCountryCode:
          type: "string"
          nullable: true
          description: "Country dialing code for the hotel phone number."
        numMeetingRooms:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Count of meeting/event rooms at the hotel; an attribute for conference and group-business positioning."
        totalMeetingSpaceSquareFeet:
          type: "number"
          nullable: true
          description: "Total square footage of meeting/event space, indicating group and convention capacity."
        largestMeetingSpaceSquareFeet:
          type: "number"
          nullable: true
          description: "Square footage of the single largest meeting/ballroom space; determines the maximum event size the hotel can host."
        numSeats:
          type: "integer"
          format: "int32"
          nullable: true
          description: "Seating capacity (e.g. of banquet/meeting or food-and-beverage space) at the hotel."
        hotelTier:
          allOf:
            - "$ref": "#/components/schemas/HotelTier"
          nullable: true
          description: "Tier within the hotel class hierarchy, a finer segmentation of market positioning."
        hotelOperationType:
          allOf:
            - "$ref": "#/components/schemas/HotelOperationType"
          nullable: true
          description: "Code describing how the hotel is operated (e.g. franchised, managed, independent), distinguishing operator arrangements."
        hotelLocationType:
          allOf:
            - "$ref": "#/components/schemas/HotelLocationType"
          nullable: true
          description: "Code classifying the hotel's location setting (e.g. airport, suburban, urban, resort), a demand-driver attribute."
        hotelPriceRating:
          allOf:
            - "$ref": "#/components/schemas/HotelPriceRating"
          nullable: true
          description: "Price-tier rating of the hotel, summarizing its relative price point."
        numSwimmingPools:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Count of indoor pools, a guest amenity attribute. Indoor pool count when it is recorded, otherwise the outdoor pool count (the two are not added together); null only when both are missing."
        numGolfHoles:
          type: "integer"
          minimum: 0
          maximum: 255
          nullable: true
          description: "Number of golf holes available at or with the hotel, a resort amenity attribute."
        initialOpeningDate:
          type: "string"
          format: "date-time"
          nullable: true
          description: "Not populated in this dataset; expect null."
        operatingStatus:
          allOf:
            - "$ref": "#/components/schemas/HotelOperatingStatus"
          description: "Lifecycle/operating status of the hotel (e.g. open, proposed, under construction, closed); affects inventory inclusion."
        hotelClass:
          allOf:
            - "$ref": "#/components/schemas/HotelClass"
          description: "Hospitality class/segment (e.g. luxury, upscale, midscale, economy) classifying the hotel's market positioning."
        rooms:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyHospitalityRoom"
          description: "Collection of room-type records describing the hotel's room product mix. Hotel room types copied from the hotel record."
        seasonalClosureMonths:
          type: "array"
          items:
            type: "integer"
            format: "int32"
          description: "List of month numbers during which the hotel is seasonally closed, relevant for resort/seasonal operations. Month numbers converted to whole numbers; an empty list when none are recorded."
        isHotelEquivalentSupply:
          type: "boolean"
          nullable: true
          description: "Flag indicating the property is counted as hotel-equivalent lodging supply (e.g. serviced/extended-stay) for market supply analysis."
    CommercialPropertyResidentialParkingPolicy:
