          type: "string"
          nullable: true
          description: "Contact email address for the apartment community's leasing office."
        sitePhoneNumber:
          type: "string"
          nullable: true
          description: "Contact phone number for the apartment community's leasing office."
        sitePhoneCountryCode:
          type: "string"
          nullable: true
          description: "Country dialing code accompanying the leasing-office phone number."
        sitePhoneExtension:
          type: "string"
          nullable: true
          description: "Phone extension for reaching the leasing office at the contact phone number."
        residentialProfile:
          allOf:
            - "$ref": "#/components/schemas/CommercialPropertyResidentialProfile"
          nullable: true
          description: "Identifier of the associated residential profile that holds shared rental/community profile data. Residential profile (parking, pets, schools, colleges) looked up by the apartment record's profile id."
        elevators:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyElevator"
          description: "Collection of elevator records describing the property's vertical-transportation equipment by type and count. Elevators taken from the property's structural record rather than the apartment record."
        models:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyApartmentModel"
          description: "Collection of active apartment floor-plan model records defining the community's unit mix (bed/bath layouts, counts, rents)."
        units:
          type: "array"
          items:
            "$ref": "#/components/schemas/CommercialPropertyApartmentUnit2"
          description: "Collection of individual apartment unit records at the community (beds, baths, square feet, rent), the granular multifamily unit-mix detail."
